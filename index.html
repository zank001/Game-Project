<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2b2320">
<title>วอลเลย์คลับ สตอรี่ · Volley Club Story</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%90%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== หน้าไตเติล ===== -->
  <div id="titleScreen" class="title-screen">
    <div class="title-inner">
      <canvas id="titleCanvas" width="192" height="120" aria-hidden="true"></canvas>
      <h1 class="game-logo"><span>วอลเลย์คลับ</span><em>สตอรี่</em></h1>
      <p class="tagline">ปั้นสโมสรวอลเลย์บอลเล็กๆ สู่แชมป์ระดับโลก!</p>
      <div class="title-buttons">
        <button id="btnContinue" class="btn big" hidden>▶ เล่นต่อ</button>
        <button id="btnNewGame" class="btn big alt">✦ เริ่มเกมใหม่</button>
      </div>
      <p class="title-credit">สไตล์เกมจำลองบริหารทีม · เล่นออฟไลน์ได้ 100%</p>
    </div>
  </div>

  <!-- ===== ตัวเกมหลัก ===== -->
  <div id="gameRoot" hidden>
    <header id="topbar">
      <div class="tb-club" id="tbClub">🏐 สโมสร</div>
      <div class="tb-stats">
        <span id="tbDate" title="วันที่">📅 ปี 1 ด.1 สป.1</span>
        <span id="tbMoney" title="เงินสโมสร">💰 0</span>
        <span id="tbFans" title="แฟนคลับ">💛 0</span>
      </div>
    </header>

    <main id="screen"></main>

    <nav id="tabs">
      <button data-tab="home" class="tab on">🏠<span>หลัก</span></button>
      <button data-tab="team" class="tab">👥<span>ทีม</span></button>
      <button data-tab="club" class="tab">🏟️<span>สโมสร</span></button>
      <button data-tab="honor" class="tab">🏆<span>เกียรติยศ</span></button>
      <button data-tab="system" class="tab">⚙️<span>ระบบ</span></button>
    </nav>
  </div>

  <!-- ===== หน้าจอแข่งขัน ===== -->
  <div id="matchOverlay" hidden>
    <div class="match-frame">
      <div id="matchHeader">
        <div class="mh-team left"><span id="mhHomeName">ทีมเรา</span><b id="mhHomeScore">0</b></div>
        <div class="mh-mid" id="mhLabel">นัดกระชับมิตร</div>
        <div class="mh-team right"><b id="mhAwayScore">0</b><span id="mhAwayName">คู่แข่ง</span></div>
      </div>
      <canvas id="matchCanvas" width="384" height="216"></canvas>
      <div id="matchComment">🏐 ...</div>
      <div id="matchControls">
        <button id="btnSpeed" class="btn small">⏩ x1</button>
        <button id="btnSkip" class="btn small alt">⏭ ข้ามไปดูผล</button>
      </div>
    </div>
  </div>

  <!-- ===== โมดัล ===== -->
  <div id="modalWrap" hidden>
    <div id="modalBox"></div>
  </div>

  <div id="toasts"></div>
</div>

<script src="js/data.js"></script>
<script src="js/sound.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/match.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
