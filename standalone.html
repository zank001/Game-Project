<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2b2320">
<title>วอลเลย์คลับ สตอรี่ · Volley Club Story</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%90%3C/text%3E%3C/svg%3E">
<style>
/* =============================================================
   style.css — UI สไตล์เกมจำลองบริหาร (แผงครีม ขอบหนา มุมมน)
   ============================================================= */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* กัน display ของกฎ ID ไปทับ attribute hidden ของเบราว์เซอร์ */
[hidden] { display: none !important; }

:root {
  --bg: #2b2320;
  --panel: #f7ecd2;
  --panel2: #efe0bd;
  --ink: #43372c;
  --line: #5a4632;
  --accent: #e8862e;
  --accent-dark: #b5641c;
  --good: #3fa05a;
  --bad: #c04a4a;
  --gold: #f0c040;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Trebuchet MS', Tahoma, 'Leelawadee UI', 'Noto Sans Thai', sans-serif;
  overflow: hidden;
  user-select: none;
}

#app { height: 100dvh; display: flex; flex-direction: column; align-items: center; }

canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

/* ================= หน้าไตเติล ================= */
.title-screen {
  height: 100dvh; width: 100%;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(240,192,64,.12), transparent 60%),
    var(--bg);
}
.title-inner { text-align: center; padding: 16px; max-width: 460px; width: 100%; }
#titleCanvas { width: min(384px, 90vw); height: auto; border: 4px solid var(--line); border-radius: 10px; background: var(--bg); box-shadow: 0 6px 0 rgba(0,0,0,.4); }
.game-logo { margin: 14px 0 4px; line-height: 1.05; }
.game-logo span {
  display: block; font-size: 2.4rem; font-weight: 900; color: var(--gold);
  text-shadow: 2px 2px 0 var(--line), 4px 4px 0 rgba(0,0,0,.45);
  letter-spacing: 2px;
}
.game-logo em {
  display: block; font-style: normal; font-size: 1.5rem; font-weight: 900; color: var(--panel);
  text-shadow: 2px 2px 0 var(--line);
  letter-spacing: 10px;
}
.tagline { color: #cdbfa5; margin: 8px 0 18px; font-size: .95rem; }
.title-buttons { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.title-credit { margin-top: 18px; color: #8d7f68; font-size: .78rem; }

/* ================= ปุ่ม ================= */
.btn {
  font-family: inherit; font-weight: 800; font-size: .95rem;
  color: var(--ink); background: var(--panel);
  border: 3px solid var(--line); border-radius: 10px;
  padding: 9px 18px; cursor: pointer;
  box-shadow: 0 3px 0 var(--line);
  transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.btn.alt { background: var(--accent); color: #fff; border-color: var(--accent-dark); box-shadow: 0 3px 0 var(--accent-dark); }
.btn.ghost { background: transparent; color: var(--panel); box-shadow: none; border-color: #6b5947; }
#modalBox .btn.ghost, .panel .btn.ghost { color: var(--ink); }
.btn.big { font-size: 1.15rem; padding: 12px 34px; min-width: 240px; }
.btn.small { font-size: .82rem; padding: 6px 12px; box-shadow: 0 2px 0 var(--line); }
.btn.small.alt { box-shadow: 0 2px 0 var(--accent-dark); }
.btn.wide { width: 100%; margin-top: 8px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:active { transform: none; box-shadow: 0 3px 0 var(--line); }

/* ================= เลย์เอาต์เกม ================= */
#gameRoot { width: 100%; max-width: 520px; height: 100dvh; display: flex; flex-direction: column; }

#topbar {
  background: #43372c; color: var(--panel);
  border-bottom: 3px solid #2a211a;
  padding: 8px 12px;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.tb-club { font-weight: 900; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }
.tb-stats { display: flex; gap: 10px; font-size: .82rem; font-weight: 700; flex-wrap: wrap; justify-content: flex-end; }
.tb-stats span { white-space: nowrap; }

#screen { flex: 1; overflow-y: auto; padding: 10px 10px 14px; }

#tabs {
  display: flex; background: #43372c; border-top: 3px solid #2a211a;
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  gap: 4px;
}
.tab {
  flex: 1; background: transparent; border: none; color: #a8987e;
  font-family: inherit; font-size: 1.15rem; font-weight: 700;
  padding: 6px 0 4px; border-radius: 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.tab span { font-size: .62rem; }
.tab.on { background: var(--panel); color: var(--ink); }

/* ================= แผง ================= */
.panel {
  background: var(--panel); border: 3px solid var(--line); border-radius: 12px;
  box-shadow: 0 3px 0 var(--line);
  padding: 10px 12px; margin-bottom: 10px;
}
.panel h3 { font-size: .95rem; margin-bottom: 8px; }
.panel h4 { font-size: .85rem; }

.banner {
  background: var(--panel2); border: 3px solid var(--line); border-radius: 12px;
  box-shadow: 0 3px 0 var(--line);
  padding: 10px 12px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  font-size: .9rem;
}
.banner.hot { background: #ffe2b8; border-color: var(--accent-dark); box-shadow: 0 3px 0 var(--accent-dark); animation: glow 1.6s infinite; }
@keyframes glow { 0%, 100% { background: #ffe2b8; } 50% { background: #ffd193; } }
.banner small { color: #7a6a52; }

.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.row3:last-child { margin-bottom: 0; }
.stat-tile {
  background: var(--panel2); border: 2px solid var(--line); border-radius: 10px;
  padding: 6px 8px; text-align: center;
}
.stat-tile small { display: block; font-size: .68rem; color: #7a6a52; font-weight: 700; }
.stat-tile b { font-size: 1.05rem; }

/* ================= แถบพลัง ================= */
.bar {
  height: 7px; background: #d8c7a4; border-radius: 4px; overflow: hidden;
  border: 1px solid #b5a37f; margin-top: 3px;
}
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar.cond i, .bar.chem i { background: var(--good); }
.bar.mor i { background: var(--gold); }
.bar.bad i { background: var(--bad); }

/* ================= การ์ดแอ็กชัน ================= */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.action-card {
  font-family: inherit; background: var(--panel2);
  border: 3px solid var(--line); border-radius: 12px;
  box-shadow: 0 3px 0 var(--line);
  padding: 10px 8px; cursor: pointer; text-align: center;
  font-size: 1.3rem;
  transition: transform .06s, box-shadow .06s;
}
.action-card:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.action-card b { display: block; font-size: .95rem; color: var(--ink); }
.action-card small { display: block; font-size: .7rem; color: #7a6a52; font-weight: 700; }
.action-card em { color: var(--bad); font-style: normal; }

/* ================= ล็อกข่าว ================= */
.log { list-style: none; font-size: .78rem; }
.log li { padding: 4px 2px; border-bottom: 1px dashed #cbb98f; color: #5d4f3d; }
.log li:first-child { color: var(--ink); font-weight: 700; }

/* ================= รายการแถว ================= */
.list { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow-y: auto; }
.list-row {
  font-family: inherit; display: flex; align-items: center; gap: 10px;
  background: var(--panel2); border: 2px solid var(--line); border-radius: 10px;
  padding: 8px 10px; cursor: pointer; text-align: left; width: 100%;
}
.list-row:active { background: #e5d3a8; }
.list-row.off { opacity: .5; }
.lr-icon { font-size: 1.3rem; min-width: 30px; text-align: center; }
.lr-main { flex: 1; font-size: .88rem; }
.lr-main small { display: block; font-size: .72rem; color: #7a6a52; }
.lr-side { font-weight: 800; font-size: .82rem; white-space: nowrap; }

/* ================= ทีม ================= */
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pcard {
  font-family: inherit; position: relative;
  background: var(--panel2); border: 3px solid var(--line); border-radius: 12px;
  box-shadow: 0 2px 0 var(--line);
  padding: 8px; cursor: pointer; text-align: left;
}
.pcard:active { transform: translateY(2px); box-shadow: none; }
/* content-box ให้พิกเซลสเกลเป็นจำนวนเต็มพอดี (20x22 → 2x/3x) ไม่โดน border กิน */
.face { box-sizing: content-box; width: 40px; height: 44px; border: 2px solid var(--line); border-radius: 6px; float: left; margin-right: 8px; }
.face.big { width: 60px; height: 66px; float: none; }
.pc-name { display: flex; align-items: center; gap: 5px; font-size: .88rem; }
.pc-info { display: block; font-size: .72rem; color: #7a6a52; font-weight: 700; }
.sub-tag {
  position: absolute; top: 6px; right: 6px;
  background: #8d7f68; color: #fff; font-size: .6rem; font-weight: 800;
  padding: 1px 6px; border-radius: 6px;
}
.pos-badge {
  display: inline-block; color: #fff; font-size: .62rem; font-weight: 800;
  padding: 1px 6px; border-radius: 6px; vertical-align: middle;
}

.stat-row { display: grid; grid-template-columns: 86px 1fr 34px; gap: 8px; align-items: center; font-size: .82rem; margin-bottom: 4px; }
.stat-row b { text-align: right; }
.pm-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.pm-head h3 { font-size: 1rem; }

/* ================= สโมสร ================= */
.fac {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel2); border: 2px solid var(--line); border-radius: 10px;
  padding: 8px 10px; margin-bottom: 6px; font-size: .88rem;
}
.fac.locked { opacity: .55; }
.pips { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: middle; }
.pip { width: 9px; height: 9px; border-radius: 3px; background: #d8c7a4; border: 1px solid #b5a37f; display: inline-block; }
.pip.on { background: var(--good); }

/* ================= โมดัล ================= */
#modalWrap {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(20, 14, 10, .72);
  display: flex; align-items: center; justify-content: center;
  padding: 14px;
}
#modalBox {
  background: var(--panel); border: 4px solid var(--line); border-radius: 14px;
  box-shadow: 0 6px 0 rgba(0,0,0,.4);
  width: 100%; max-width: 440px; max-height: 86dvh; overflow-y: auto;
  padding: 16px;
  animation: pop .18s ease-out;
}
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#modalBox h3 { margin-bottom: 8px; font-size: 1.05rem; }
#modalBox p { font-size: .9rem; margin-bottom: 8px; }
.modal-btns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.hint { font-size: .78rem; color: #7a6a52; }
.hint.center, .center { text-align: center; }
.txt {
  width: 100%; font-family: inherit; font-size: 1rem; font-weight: 700;
  padding: 9px 12px; border: 3px solid var(--line); border-radius: 10px;
  background: #fffbef; color: var(--ink); margin: 6px 0;
}
.result-list { list-style: none; font-size: .84rem; max-height: 34vh; overflow-y: auto; }
.result-list li { padding: 3px 0; border-bottom: 1px dashed #cbb98f; }
.lvup { color: var(--accent-dark); font-style: normal; font-weight: 800; }
.warn { color: var(--bad); font-style: normal; font-size: .74rem; }
.weekly { background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-top: 10px; }
.weekly ul { list-style: none; font-size: .78rem; margin-top: 4px; }
.weekly li { padding: 2px 0; }
.round-name { text-align: center; font-weight: 800; color: var(--accent-dark); }
.trophy-big { text-align: center; font-size: 3rem; margin: 6px 0; }
.vs { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 10px; margin: 8px 0; text-align: center; }
.vs > div { flex: 1; font-size: .92rem; }
.vs small { display: block; color: #7a6a52; font-weight: 700; font-size: .74rem; }
.vs em { font-style: normal; font-weight: 900; color: var(--bad); }
.cands { display: flex; flex-direction: column; gap: 8px; }
.cand { background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.cand-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.cand-body { display: flex; justify-content: space-between; align-items: center; font-size: .82rem; margin-bottom: 6px; }
.stars { color: var(--accent-dark); letter-spacing: 1px; }
.help p { margin-bottom: 8px; font-size: .86rem; }

/* ================= หน้าจอแข่ง ================= */
#matchOverlay {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(20, 14, 10, .9);
  display: flex; align-items: center; justify-content: center;
  padding: 8px;
}
.match-frame { width: 100%; max-width: 560px; }
#matchHeader {
  display: flex; align-items: center; gap: 6px;
  background: #43372c; color: var(--panel);
  border: 3px solid var(--line); border-bottom: none;
  border-radius: 12px 12px 0 0;
  padding: 8px 10px; font-size: .85rem;
}
.mh-team { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.mh-team span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.mh-team.left { justify-content: flex-start; }
.mh-team.right { justify-content: flex-end; }
.mh-team b { font-size: 1.5rem; color: var(--gold); }
.mh-mid { font-size: .68rem; color: #cdbfa5; text-align: center; max-width: 30%; }
#matchCanvas { width: 100%; display: block; border: 3px solid var(--line); background: var(--bg); }
#matchComment {
  background: var(--panel); border: 3px solid var(--line); border-top: none;
  padding: 8px 12px; font-size: .9rem; font-weight: 700; min-height: 38px;
}
#matchControls {
  display: flex; gap: 8px; justify-content: center; padding: 10px 0 0;
}

/* ================= โทสต์ ================= */
#toasts { position: fixed; bottom: 74px; left: 0; right: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast {
  background: #43372c; color: var(--panel);
  border: 2px solid var(--line); border-radius: 10px;
  padding: 8px 16px; font-size: .84rem; font-weight: 700;
  opacity: 0; transform: translateY(8px);
  transition: opacity .3s, transform .3s;
  max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ================= จอเล็ก ================= */
@media (max-width: 380px) {
  .row3 { grid-template-columns: 1fr 1fr; }
  .game-logo span { font-size: 1.9rem; }
  .tb-stats { font-size: .72rem; gap: 6px; }
}

</style>
</head>
<body>
<div id="app">

  <!-- ===== หน้าไตเติล ===== -->
  <div id="titleScreen" class="title-screen">
    <div class="title-inner">
      <canvas id="titleCanvas" width="192" height="120" aria-hidden="true"></canvas>
      <h1 class="game-logo"><span>วอลเลย์คลับ</span><em>สตอรี่</em></h1>
      <p class="tagline">ปั้นสโมสรวอลเลย์บอลเล็กๆ สู่แชมป์ระดับโลก!</p>
      <div class="title-buttons">
        <button id="btnContinue" class="btn big" hidden>▶ เล่นต่อ</button>
        <button id="btnNewGame" class="btn big alt">✦ เริ่มเกมใหม่</button>
      </div>
      <p class="title-credit">สไตล์เกมจำลองบริหารทีม · เล่นออฟไลน์ได้ 100%</p>
    </div>
  </div>

  <!-- ===== ตัวเกมหลัก ===== -->
  <div id="gameRoot" hidden>
    <header id="topbar">
      <div class="tb-club" id="tbClub">🏐 สโมสร</div>
      <div class="tb-stats">
        <span id="tbDate" title="วันที่">📅 ปี 1 ด.1 สป.1</span>
        <span id="tbMoney" title="เงินสโมสร">💰 0</span>
        <span id="tbFans" title="แฟนคลับ">💛 0</span>
      </div>
    </header>

    <main id="screen"></main>

    <nav id="tabs">
      <button data-tab="home" class="tab on">🏠<span>หลัก</span></button>
      <button data-tab="team" class="tab">👥<span>ทีม</span></button>
      <button data-tab="club" class="tab">🏟️<span>สโมสร</span></button>
      <button data-tab="honor" class="tab">🏆<span>เกียรติยศ</span></button>
      <button data-tab="system" class="tab">⚙️<span>ระบบ</span></button>
    </nav>
  </div>

  <!-- ===== หน้าจอแข่งขัน ===== -->
  <div id="matchOverlay" hidden>
    <div class="match-frame">
      <div id="matchHeader">
        <div class="mh-team left"><span id="mhHomeName">ทีมเรา</span><b id="mhHomeScore">0</b></div>
        <div class="mh-mid" id="mhLabel">นัดกระชับมิตร</div>
        <div class="mh-team right"><b id="mhAwayScore">0</b><span id="mhAwayName">คู่แข่ง</span></div>
      </div>
      <canvas id="matchCanvas" width="384" height="216"></canvas>
      <div id="matchComment">🏐 ...</div>
      <div id="matchControls">
        <button id="btnSpeed" class="btn small">⏩ x1</button>
        <button id="btnSkip" class="btn small alt">⏭ ข้ามไปดูผล</button>
      </div>
    </div>
  </div>

  <!-- ===== โมดัล ===== -->
  <div id="modalWrap" hidden>
    <div id="modalBox"></div>
  </div>

  <div id="toasts"></div>
</div>
<script>
/* ===== data.js ===== */
/* =============================================================
   data.js — ข้อมูลคงที่ของเกมทั้งหมด (ไม่มี logic)
   ============================================================= */
'use strict';

const DATA = {

  /* ---------- ตำแหน่งผู้เล่น ---------- */
  positions: {
    S:  { name: 'เซ็ตเตอร์',      short: 'S',  color: '#3f6cd0', growth: { set: 3, rcv: 2, srv: 1, sta: 1 } },
    OH: { name: 'ตบหัวเสา',       short: 'OH', color: '#e05252', growth: { atk: 3, rcv: 2, srv: 1, sta: 1 } },
    MB: { name: 'บล็อกกลาง',      short: 'MB', color: '#3fa05a', growth: { blk: 3, atk: 2, sta: 2 } },
    OP: { name: 'ตบตรงข้าม',      short: 'OP', color: '#c07a2e', growth: { atk: 3, srv: 2, blk: 1, sta: 1 } },
    LB: { name: 'ลิเบอโร่',       short: 'L',  color: '#9b6bd6', growth: { rcv: 4, set: 1, sta: 2 } },
  },

  statNames: { srv: 'เสิร์ฟ', atk: 'ตบ', blk: 'บล็อก', rcv: 'รับ', set: 'เซ็ต', sta: 'อึด' },
  statIcons: { srv: '🎯', atk: '💥', blk: '🧱', rcv: '🛡️', set: '🤲', sta: '🔋' },

  /* ---------- ชื่อผู้เล่น (ชื่อเล่นไทย) ---------- */
  names: [
    'นัท', 'ต้น', 'บาส', 'เก่ง', 'โอ๊ต', 'ภูมิ', 'กัน', 'ไนซ์', 'เฟิร์ส', 'มาร์ค',
    'เจมส์', 'บอล', 'ป๊อป', 'แบงค์', 'ฟลุ๊ค', 'เน็ต', 'ท็อป', 'กอล์ฟ', 'เบสท์', 'ไอซ์',
    'ปลื้ม', 'ตะวัน', 'ภาม', 'คิม', 'อาร์ม', 'บูม', 'โฟกัส', 'กาย', 'ริว', 'เข้ม',
    'ไทด์', 'ธาม', 'ปัน', 'วิน', 'ภู', 'หนุ่ม', 'เพชร', 'สิงห์', 'ข้าวปั้น', 'เต้',
    'โจ้', 'หมู', 'เอิร์ธ', 'ซัน', 'พีค', 'เก้า', 'มอส', 'แม็ก', 'ชิน', 'ต่อ',
  ],

  /* สีผิว / สีผม สำหรับสุ่มหน้าตาสไปรต์ */
  skins: ['#f2c9a0', '#e7b98d', '#d6a06b', '#c98f5f'],
  hairs: ['#26221f', '#4a3220', '#733d1f', '#1d1d3a', '#555555', '#8a2b16', '#3d2c4f'],

/* ยูทิลสุ่มพื้นฐาน ใช้ร่วมกันทุกโมดูล */
const R = {
  int(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  chance(p) { return Math.random() < p; },
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },
};


/* ===== sound.js ===== */
/* =============================================================
   sound.js — เสียงเอฟเฟกต์สังเคราะห์ด้วย Web Audio (ไม่มีไฟล์เสียง)
   สร้าง AudioContext แบบ lazy หลัง user gesture แรกเท่านั้น
   ============================================================= */
'use strict';

const Sound = {
  ctx: null,
  muted: false,

  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },

  _tone(freq, dur, type = 'square', gain = 0.05, when = 0, slide = 0) {
    if (this.muted) return;
    const ctx = this.ensure(); if (!ctx) return;
    const t = ctx.currentTime + when;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  },

  _noise(dur, gain = 0.05, when = 0, freq = 1800) {
    if (this.muted) return;
    const ctx = this.ensure(); if (!ctx) return;
    const t = ctx.currentTime + when;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = ctx.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start(t);
  },

  /* --- UI --- */
  click()  { this._tone(880, 0.05, 'square', 0.03); },
  open()   { this._tone(523, 0.06, 'square', 0.035); this._tone(784, 0.08, 'square', 0.03, 0.05); },
  cash()   { this._tone(1047, 0.07, 'square', 0.04); this._tone(1568, 0.12, 'square', 0.04, 0.06); },
  error()  { this._tone(196, 0.15, 'sawtooth', 0.04, 0, -60); },
  levelup(){ [523, 659, 784, 1047].forEach((f, i) => this._tone(f, 0.1, 'square', 0.04, i * 0.07)); },
  train()  { this._tone(440, 0.06, 'square', 0.035); this._tone(587, 0.09, 'square', 0.03, 0.06); },

  /* --- ในสนาม --- */
  whistle(){ this._tone(2200, 0.28, 'square', 0.035, 0, 300); },
  hit()    { this._noise(0.06, 0.06, 0, 900); this._tone(180, 0.05, 'triangle', 0.05); },
  bounce() { this._tone(120, 0.08, 'triangle', 0.05, 0, -40); },
  point()  { this._tone(784, 0.08, 'square', 0.04); this._tone(1175, 0.14, 'square', 0.04, 0.07); },
  losePoint(){ this._tone(330, 0.1, 'square', 0.03, 0, -80); },
  win()    { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this._tone(f, 0.12, 'square', 0.045, i * 0.1)); },
  lose()   { [494, 440, 392, 330].forEach((f, i) => this._tone(f, 0.16, 'triangle', 0.04, i * 0.12)); },
  trophy() { [784, 1047, 1319, 1568, 2093].forEach((f, i) => this._tone(f, 0.15, 'square', 0.05, i * 0.11)); },
};


/* ===== sprites.js ===== */
/* =============================================================
   sprites.js — วาดกราฟิกพิกเซลทั้งหมดด้วย canvas fillRect
   (สนามแข่ง ผู้ชม นักกีฬาหลายท่าทาง ลูกบอล ฉากไตเติล)
   ============================================================= */
'use strict';

const Sprites = {

  px(ctx, x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  },

  shade(c, amt) {
    /* ปรับความสว่างของสี hex อย่างง่าย */
    const n = parseInt(c.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
  },

  /* ---------- สนามแข่ง (canvas 384x216) ---------- */
  drawCourt(ctx, frame = 0, crowdSeed = 1) {
    const P = this.px.bind(this, ctx);

    /* ผนังยิม + แบนเนอร์ */
    P(0, 0, 384, 58, '#5a4a3c');
    P(0, 54, 384, 4, '#43372c');
    for (let i = 0; i < 8; i++) {
      const bx = 8 + i * 48;
      P(bx, 6, 36, 10, ['#c04a4a', '#3f6cd0', '#3fa05a', '#c07a2e'][i % 4]);
      P(bx + 2, 8, 32, 2, 'rgba(255,255,255,.5)');
    }

    /* อัฒจันทร์ + ผู้ชม (ขยับตาม frame) */
    P(0, 20, 384, 34, '#6b5947');
    let s = crowdSeed;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const crowdCols = ['#e0b088', '#f2c9a0', '#d6a06b', '#c98f5f'];
    const shirtCols = ['#c04a4a', '#3f6cd0', '#3fa05a', '#e8862e', '#9b6bd6', '#f0d060', '#5a8a9a', '#c05a9a'];
    for (let row = 0; row < 3; row++) {
      for (let i = 0; i < 42; i++) {
        const cx = 4 + i * 9 + (row % 2) * 4;
        const jump = rnd() < 0.18 && ((frame >> 3) + i + row) % 4 === 0 ? -2 : 0;
        const cy = 24 + row * 11 + jump;
        P(cx, cy, 4, 3, crowdCols[Math.floor(rnd() * 4)]);     /* หัว */
        P(cx - 1, cy + 3, 6, 4, shirtCols[Math.floor(rnd() * 8)]); /* ตัว */
      }
    }

    /* พื้นไม้ */
    for (let y = 58; y < 216; y += 8) {
      P(0, y, 384, 8, y % 16 === 2 ? '#c8874e' : '#c07f47');
      P(0, y + 7, 384, 1, '#a86b3a');
    }

    /* คอร์ท (สีฟ้า + ขอบส้ม) */
    P(30, 92, 324, 112, '#e8a05a');
    P(46, 100, 292, 96, '#4a7ab5');
    /* เส้นขาว */
    P(46, 100, 292, 2, '#f2ead8'); P(46, 194, 292, 2, '#f2ead8');
    P(46, 100, 2, 96, '#f2ead8'); P(336, 100, 2, 96, '#f2ead8');
    P(140, 100, 2, 96, 'rgba(242,234,216,.55)');   /* เส้นรุก ซ้าย */
    P(242, 100, 2, 96, 'rgba(242,234,216,.55)');   /* เส้นรุก ขวา */

    /* เน็ต */
    P(189, 88, 6, 108, 'rgba(0,0,0,.12)');          /* เงาใต้เน็ต */
    P(190, 84, 4, 110, 'rgba(255,255,255,.25)');
    for (let y = 84; y < 194; y += 4) P(190, y, 4, 1, '#f2ead8');
    P(190, 84, 4, 3, '#f2ead8');                    /* แถบขอบบนเน็ต */
    P(188, 82, 2, 114, '#43372c'); P(194, 82, 2, 114, '#43372c'); /* เสา */
    P(187, 80, 4, 4, '#5a5a5a'); P(193, 80, 4, 4, '#5a5a5a');
  },

  /* ---------- นักกีฬา ----------
     x, y = จุดกึ่งกลางปลายเท้า  pose: idle|ready|set|spike|block|serve|cheer|sad
     opts = { skin, hair, jersey, flip, frame } */
  drawPlayer(ctx, x, y, pose = 'idle', opts = {}) {
    const { skin = '#f2c9a0', hair = '#26221f', jersey = '#e8862e', flip = false, frame = 0 } = opts;
    const P = (dx, dy, w, h, c) => {
      const rx = flip ? -dx - w : dx;
      this.px(ctx, x + rx, y + dy, w, h, c);
    };
    const dark = this.shade(jersey, -40);
    const shorts = '#3a3a4a';
    const bob = (pose === 'idle' || pose === 'ready') ? ((frame >> 4) % 2) : 0;
    let jump = 0;
    if (pose === 'spike') jump = 7;
    if (pose === 'block') jump = 5;

    /* เงา */
    this.px(ctx, x - 5, y - 1, 10, 2, 'rgba(0,0,0,.22)');

    const oy = -jump + bob;

    if (pose === 'ready') {
      /* ย่อตัวรับบอล แขนเหยียดไปหน้า */
      P(-4, -6 + oy, 3, 5, skin); P(1, -6 + oy, 3, 5, skin);          /* ขา */
      P(-5, -10 + oy, 10, 4, shorts);
      P(-5, -15 + oy, 10, 6, jersey); P(-5, -15 + oy, 10, 1, dark);
      P(4, -13 + oy, 5, 2, skin); P(8, -14 + oy, 2, 3, skin);          /* แขนเหยียด */
      P(-3, -21 + oy, 7, 6, skin);                                     /* หัว */
      P(-4, -23 + oy, 9, 3, hair); P(-4, -21 + oy, 2, 3, hair);
      P(2, -19 + oy, 1, 1, '#26221f');                                 /* ตา */
    } else if (pose === 'set') {
      P(-4, -8 + oy, 3, 7, skin); P(1, -8 + oy, 3, 7, skin);
      P(-4, -12 + oy, 8, 4, shorts);
      P(-4, -18 + oy, 8, 6, jersey); P(-4, -18 + oy, 8, 1, dark);
      P(-6, -22 + oy, 2, 5, skin); P(4, -22 + oy, 2, 5, skin);         /* แขนชูสองข้าง */
      P(-3, -24 + oy, 7, 6, skin);
      P(-4, -26 + oy, 9, 3, hair); P(-4, -24 + oy, 2, 3, hair);
      P(2, -22 + oy, 1, 1, '#26221f');
    } else if (pose === 'block') {
      P(-4, -8 + oy, 3, 7, skin); P(1, -8 + oy, 3, 7, skin);
      P(-4, -12 + oy, 8, 4, shorts);
      P(-4, -18 + oy, 8, 6, jersey); P(-4, -18 + oy, 8, 1, dark);
      P(-6, -25 + oy, 2, 8, skin); P(4, -25 + oy, 2, 8, skin);         /* แขนชูตรงสูง */
      P(-3, -24 + oy, 7, 6, skin);
      P(-4, -26 + oy, 9, 3, hair); P(-4, -24 + oy, 2, 3, hair);
      P(2, -22 + oy, 1, 1, '#26221f');
    } else if (pose === 'spike') {
      P(-4, -7 + oy, 3, 5, skin); P(1, -8 + oy, 3, 6, skin);           /* ขาลอย */
      P(-4, -12 + oy, 8, 4, shorts);
      P(-4, -18 + oy, 8, 6, jersey); P(-4, -18 + oy, 8, 1, dark);
      P(4, -26 + oy, 2, 9, skin);                                      /* แขนตบชูสูง */
      P(-6, -16 + oy, 2, 4, skin);                                     /* แขนถ่วง */
      P(-3, -24 + oy, 7, 6, skin);
      P(-4, -26 + oy, 9, 3, hair); P(-4, -24 + oy, 2, 3, hair);
      P(2, -22 + oy, 1, 1, '#26221f');
    } else if (pose === 'serve') {
      P(-4, -7 + oy, 3, 6, skin); P(1, -7 + oy, 3, 6, skin);
      P(-4, -11 + oy, 8, 4, shorts);
      P(-4, -17 + oy, 8, 6, jersey); P(-4, -17 + oy, 8, 1, dark);
      P(3, -25 + oy, 2, 9, skin);                                      /* แขนง้างเสิร์ฟ */
      P(-3, -23 + oy, 7, 6, skin);
      P(-4, -25 + oy, 9, 3, hair); P(-4, -23 + oy, 2, 3, hair);
      P(2, -21 + oy, 1, 1, '#26221f');
    } else if (pose === 'cheer') {
      const up = (frame >> 3) % 2 ? -1 : 0;
      P(-4, -7, 3, 6, skin); P(1, -7, 3, 6, skin);
      P(-4, -11, 8, 4, shorts);
      P(-4, -17, 8, 6, jersey); P(-4, -17, 8, 1, dark);
      P(-6, -22 + up, 2, 5, skin); P(4, -22 + up, 2, 5, skin);
      P(-3, -23, 7, 6, skin);
      P(-4, -25, 9, 3, hair); P(-4, -23, 2, 3, hair);
      P(2, -21, 1, 1, '#26221f');
    } else if (pose === 'sad') {
      P(-4, -7, 3, 6, skin); P(1, -7, 3, 6, skin);
      P(-4, -11, 8, 4, shorts);
      P(-4, -17, 8, 6, jersey);
      P(-6, -15, 2, 5, skin); P(4, -15, 2, 5, skin);                   /* แขนตก */
      P(-3, -22, 7, 6, skin);
      P(-4, -23, 9, 3, hair); P(-4, -21, 2, 3, hair);
    } else { /* idle */
      P(-4, -7 + oy, 3, 6, skin); P(1, -7 + oy, 3, 6, skin);
      P(-4, -11 + oy, 8, 4, shorts);
      P(-4, -17 + oy, 8, 6, jersey); P(-4, -17 + oy, 8, 1, dark);
      P(-6, -16 + oy, 2, 5, skin); P(4, -16 + oy, 2, 5, skin);
      P(-3, -23 + oy, 7, 6, skin);
      P(-4, -25 + oy, 9, 3, hair); P(-4, -23 + oy, 2, 3, hair);
      P(2, -21 + oy, 1, 1, '#26221f');
    }
  },

  /* ---------- ลูกบอล  (x,y = จุดบนพื้น, h = ความสูงลอย) ---------- */
  drawBall(ctx, x, y, h) {
    const sw = Math.max(2, 6 - h / 18);
    this.px(ctx, x - sw / 2, y - 1, sw, 2, 'rgba(0,0,0,.25)');   /* เงา */
    const by = y - h;
    this.px(ctx, x - 2, by - 4, 4, 4, '#f2ead8');
    this.px(ctx, x - 3, by - 3, 6, 2, '#f2ead8');
    this.px(ctx, x - 1, by - 4, 2, 1, '#e05252');                /* ลายแดง */
    this.px(ctx, x - 3, by - 2, 1, 1, '#3f6cd0');                /* ลายน้ำเงิน */
    this.px(ctx, x + 2, by - 3, 1, 1, '#3f6cd0');
  },

  /* ---------- รูปหน้าผู้เล่นเล็กๆ (avatar 20x22 บน canvas ย่อย) ---------- */
  drawFace(ctx, skin, hair, jersey) {
    const P = this.px.bind(this, ctx);
    P(0, 0, 20, 22, '#f7ecd2');
    P(3, 15, 14, 7, jersey);
    P(3, 15, 14, 2, this.shade(jersey, -40));
    P(5, 4, 10, 10, skin);
    P(4, 2, 12, 4, hair); P(4, 4, 2, 5, hair); P(14, 4, 2, 5, hair);
    P(8, 9, 1, 2, '#26221f'); P(12, 9, 1, 2, '#26221f');
    P(9, 12, 2, 1, '#b56a4a');
  },

  /* ---------- ฉากไตเติล (canvas 192x120) ---------- */
  drawTitle(ctx, frame = 0) {
    const P = this.px.bind(this, ctx);
    P(0, 0, 192, 120, '#2b2320');
    /* แสงสปอตไลต์ */
    P(20, 0, 40, 120, 'rgba(255,240,200,.05)');
    P(130, 0, 40, 120, 'rgba(255,240,200,.05)');
    /* พื้น */
    for (let y = 78; y < 120; y += 6) P(0, y, 192, 6, y % 12 === 6 ? '#c8874e' : '#c07f47');
    P(20, 84, 152, 32, '#4a7ab5');
    P(20, 84, 152, 2, '#f2ead8'); P(20, 114, 152, 2, '#f2ead8');
    /* เน็ต */
    for (let y = 58; y < 112; y += 4) P(94, y, 4, 1, '#f2ead8');
    P(94, 58, 4, 2, '#f2ead8');
    P(92, 56, 2, 60, '#43372c'); P(98, 56, 2, 60, '#43372c');
    /* ผู้เล่นตบ vs บล็อก */
    this.drawPlayer(ctx, 70, 108, 'spike', { jersey: '#e8862e', frame });
    this.drawPlayer(ctx, 122, 108, 'block', { jersey: '#3f6cd0', flip: true, frame });
    this.drawPlayer(ctx, 40, 112, 'cheer', { jersey: '#e8862e', frame, skin: '#e7b98d' });
    this.drawPlayer(ctx, 152, 112, 'ready', { jersey: '#3f6cd0', flip: true, frame, hair: '#733d1f' });
    /* ลูกบอลลอยเหนือเน็ต */
    const bh = 46 + Math.sin(frame / 12) * 3;
    this.drawBall(ctx, 96, 106, bh);
  },
};


/* ===== game.js ===== */
/* =============================================================
   game.js — สถานะเกมและกฎทั้งหมด (ไม่แตะ DOM)
   ============================================================= */
'use strict';

/* ที่เก็บเซฟที่ทนต่อ sandbox: ใช้ localStorage ถ้าใช้ได้ ไม่งั้นเก็บในหน่วยความจำ */
const Store = (() => {
  let ok = false;
  const mem = {};
  try { const k = '__vcs_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); ok = true; } catch (e) { ok = false; }
  return {
    persistent: ok,
    get(k) { try { return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return k in mem ? mem[k] : null; } },
    set(k, v) { try { if (ok) localStorage.setItem(k, v); else mem[k] = v; } catch (e) { mem[k] = v; } },
    remove(k) { try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch (e) { delete mem[k]; } },
  };
})();

const SAVE_KEY = 'vcs_save_v1';

const Game = {
  state: null,

  /* ================= เริ่ม / เซฟ / โหลด ================= */

  hasSave() { return !!Store.get(SAVE_KEY); },

  save() {
    if (!this.state) return;
    try { Store.set(SAVE_KEY, JSON.stringify(this.state)); } catch (e) { /* เต็ม/ผิดพลาด: ข้าม */ }
  },

  load() {
    const raw = Store.get(SAVE_KEY);
    if (!raw) return false;
    try {
      const st = JSON.parse(raw);
      if (!st || !Array.isArray(st.players) || !st.club) return false;
      this.state = st;
      return true;
    } catch (e) { return false; }
  },

  reset() { Store.remove(SAVE_KEY); this.state = null; },

  newGame(clubName) {
    const usedNames = [];
    const mk = (pos, bonus) => this._makePlayer(pos, 14 + bonus, usedNames);
    this.state = {
      v: 1,
      club: clubName || 'วอลเลย์คลับ',
      year: 1, month: 1, week: 1,
      money: 12000, fans: 60,
      chem: 40, morale: 70,
      nextPid: 1,
      players: [],
      starterIds: [],
      facilities: { gym: 0, machine: 0, video: 0, spa: 0, canteen: 0, shop: 0 },
      trophies: [],
      record: { w: 0, l: 0 },
      bestFinish: {},
      played: {},            /* played[year] = [tournamentId] */
      pendingCandidates: null,
      scoutDiscount: false,
      worldChampion: false,
      log: [],
    };
    /* ทีมเริ่มต้น 7 คน: ตัวจริง 6 + สำรอง 1 */
    const roster = [mk('S', 4), mk('OH', 5), mk('OH', 3), mk('MB', 4), mk('MB', 2), mk('OP', 5), mk('LB', 3)];
    roster.forEach(p => this.state.players.push(p));
    this.state.starterIds = roster.slice(0, 6).map(p => p.id);
    this.pushLog('🏐 ก่อตั้งสโมสร "' + this.state.club + '" — เป้าหมาย: แชมป์โลก!');
    this.save();
  },

  _makePlayer(pos, base, usedNames) {
    const st = this.state;
    const name = this._uniqueName(usedNames);
    const g = DATA.positions[pos].growth;
    const stats = {};
    for (const k of ['srv', 'atk', 'blk', 'rcv', 'set', 'sta']) {
      stats[k] = Math.max(5, Math.min(99, base + R.int(-4, 4) + (g[k] ? g[k] * 2 : 0)));
    }
    return {
      id: st.nextPid++,
      name, pos,
      lv: 1, exp: 0,
      pot: R.int(1, 3),
      stats,
      cond: R.int(80, 100),
      skin: R.pick(DATA.skins),
      hair: R.pick(DATA.hairs),
    };
  },

  _uniqueName(used) {
    const taken = new Set([...(this.state ? this.state.players.map(p => p.name) : []), ...used]);
    const free = DATA.names.filter(n => !taken.has(n));
    const name = free.length ? R.pick(free) : R.pick(DATA.names) + '​' + R.int(2, 9);
    used.push(name);
    return name;
  },

  /* ================= ตัวช่วยอ่านค่า ================= */

  fmtMoney(n) { return '฿' + Math.round(n).toLocaleString('en-US'); },
  fmtNum(n) { return Math.round(n).toLocaleString('en-US'); },
  dateStr() { const s = this.state; return `ปี ${s.year} เดือน ${s.month} สัปดาห์ ${s.week}`; },

  playerById(id) { return this.state.players.find(p => p.id === id); },
  starters() { return this.state.starterIds.map(id => this.playerById(id)).filter(Boolean); },
  bench() { return this.state.players.filter(p => !this.state.starterIds.includes(p.id)); },

  playerPower(p) {
    const s = p.stats;
    return Math.round((s.srv + s.atk + s.blk + s.rcv + s.set + s.sta) / 6);
  },

  teamPower() {
    const st = this.starters();
    if (!st.length) return 0;
    const avg = st.reduce((a, p) => a + this.playerPower(p), 0) / st.length;
    return Math.round(avg * (0.9 + 0.2 * this.state.chem / 100));
  },

  salaryOf(p) { return 15 + p.lv * 12 + p.pot * 8; },
  totalSalary() { return this.state.players.reduce((a, p) => a + this.salaryOf(p), 0); },

  sponsorsActive() { return DATA.sponsors.filter(sp => this.state.fans >= sp.fans); },
  sponsorIncome() { return this.sponsorsActive().reduce((a, sp) => a + sp.weekly, 0); },
  shopIncome() {
    const lvl = this.state.facilities.shop;
    return lvl ? lvl * (100 + Math.floor(this.state.fans * 0.04)) : 0;
  },

  facilityLevel(fid) { return this.state.facilities[fid] || 0; },

  expNeed(lv) { return 50 + lv * 30; },

  pushLog(msg) {
    this.state.log.unshift(`[ปี${this.state.year} ด.${this.state.month} สป.${this.state.week}] ${msg}`);
    if (this.state.log.length > 40) this.state.log.length = 40;
  },

  /* ================= การกระทำรายสัปดาห์ ================= */

  /* ฝึกซ้อม: ทั้งทีมได้สเตตัส ตัดเงิน+ความสดชื่น แล้วเวลาเดินหน้า 1 สัปดาห์ */
  actTraining(tid) {
    const t = DATA.trainings.find(x => x.id === tid);
    if (!t || this.state.money < t.cost) return null;
    this.state.money -= t.cost;
    const facMult = 1 + 0.25 * this.facilityLevel(t.fac);
    const results = [];
    for (const p of this.state.players) {
      const tired = p.cond < 25;
      const gains = {};
      for (const [k, v] of Object.entries(t.stats)) {
        let g = v * facMult * (0.8 + p.pot * 0.1);
        if (p.stats[k] >= 90) g *= 0.2;
        else if (p.stats[k] >= 70) g *= 0.5;
        else if (p.stats[k] >= 50) g *= 0.75;
        if (tired) g *= 0.4;
        g = Math.max(p.stats[k] >= 99 ? 0 : 1, Math.round(g + (Math.random() - 0.5)));
        p.stats[k] = Math.min(99, p.stats[k] + g);
        gains[k] = g;
      }
      p.cond = Math.max(0, p.cond - (t.cond + R.int(0, 4)));
      const lvls = this.giveExp(p, 6);
      results.push({ p, gains, lvls, tired });
    }
    if (t.chem) {
      const bonus = t.chem + this.facilityLevel('video');
      this.state.chem = Math.min(100, this.state.chem + bonus);
    }
    this.pushLog(`${t.icon} ${t.name} (−${this.fmtMoney(t.cost)})`);
    const weekly = this.advanceWeek();
    return { training: t, results, weekly };
  },

  /* พักผ่อน: ฟื้นความสดชื่น + กำลังใจ */
  actRest() {
    const spa = this.facilityLevel('spa'), canteen = this.facilityLevel('canteen');
    const condUp = 30 + spa * 6;
    const morUp = 10 + canteen * 3;
    for (const p of this.state.players) p.cond = Math.min(100, p.cond + condUp + R.int(0, 6));
    this.state.morale = Math.min(100, this.state.morale + morUp);
    this.pushLog(`😴 พักผ่อนทั้งทีม (+ความสดชื่น ${condUp})`);
    const weekly = this.advanceWeek();
    return { condUp, morUp, weekly };
  },

  /* แมวมอง: จ่ายเงินเพื่อสุ่มผู้เล่นใหม่ 3 คนมาให้เลือกเซ็น */
  scoutCost() { return this.state.scoutDiscount ? 400 : 800; },

  actScout() {
    const cost = this.scoutCost();
    if (this.state.money < cost) return null;
    this.state.money -= cost;
    this.state.scoutDiscount = false;
    const tp = Math.max(14, this.teamPower());
    const positions = ['S', 'OH', 'OH', 'MB', 'OP', 'LB'];
    const cands = [];
    const used = [];
    for (let i = 0; i < 3; i++) {
      const pos = R.pick(positions);
      const base = tp + R.int(-5, 7);
      const c = this._makePlayer(pos, base, used);
      c.pot = Math.min(5, R.int(1, 3) + (R.chance(0.3) ? 1 : 0) + (R.chance(0.1) ? 1 : 0));
      c.fee = Math.max(500, this.playerPower(c) * 130 + c.pot * 400);
      cands.push(c);
    }
    this.state.pendingCandidates = cands;
    this.pushLog(`🕵️ ส่งแมวมองเสาะหานักกีฬา (−${this.fmtMoney(cost)})`);
    const weekly = this.advanceWeek();
    return { cands, weekly };
  },

  signCandidate(idx) {
    const cands = this.state.pendingCandidates;
    if (!cands || !cands[idx]) return { ok: false, why: 'ไม่พบผู้เล่น' };
    if (this.state.players.length >= 10) return { ok: false, why: 'ทีมเต็มแล้ว (สูงสุด 10 คน)' };
    const c = cands[idx];
    if (this.state.money < c.fee) return { ok: false, why: 'เงินไม่พอจ่ายค่าเซ็นสัญญา' };
    this.state.money -= c.fee;
    const p = { ...c };
    delete p.fee;
    p.id = this.state.nextPid++;
    this.state.players.push(p);
    cands.splice(idx, 1);
    if (!cands.length) this.state.pendingCandidates = null;
    this.state.chem = Math.max(0, this.state.chem - 4);
    this.pushLog(`✍️ เซ็นสัญญา "${p.name}" (${DATA.positions[p.pos].name}) เข้าทีม`);
    this.save();
    return { ok: true, p };
  },

  dismissCandidates() { this.state.pendingCandidates = null; this.save(); },

  releasePlayer(id) {
    if (this.state.players.length <= 6) return { ok: false, why: 'ทีมต้องมีอย่างน้อย 6 คน' };
    if (this.state.starterIds.includes(id) && this.bench().length === 0)
      return { ok: false, why: 'ไม่มีตัวสำรองมาแทน' };
    const p = this.playerById(id);
    if (!p) return { ok: false, why: 'ไม่พบผู้เล่น' };
    this.state.players = this.state.players.filter(x => x.id !== id);
    if (this.state.starterIds.includes(id)) {
      const sub = this.bench()[0] || this.state.players.find(x => !this.state.starterIds.includes(x.id));
      this.state.starterIds = this.state.starterIds.map(x => x === id ? sub.id : x);
    }
    this.state.starterIds = this.state.starterIds.filter(x => this.playerById(x));
    this.pushLog(`👋 "${p.name}" ออกจากทีม`);
    this.save();
    return { ok: true };
  },

  swapStarter(starterId, benchId) {
    const ids = this.state.starterIds;
    const i = ids.indexOf(starterId);
    if (i < 0 || ids.includes(benchId) || !this.playerById(benchId)) return false;
    ids[i] = benchId;
    this.save();
    return true;
  },

  upgradeFacility(fid) {
    const f = DATA.facilities.find(x => x.id === fid);
    const lvl = this.facilityLevel(fid);
    if (!f || lvl >= f.costs.length) return { ok: false, why: 'อัปเกรดสูงสุดแล้ว' };
    const cost = f.costs[lvl];
    if (this.state.money < cost) return { ok: false, why: 'เงินไม่พอ' };
    this.state.money -= cost;
    this.state.facilities[fid] = lvl + 1;
    this.pushLog(`🔨 อัปเกรด "${f.name}" เป็นระดับ ${lvl + 1}`);
    this.save();
    return { ok: true, lvl: lvl + 1, cost };
  },

  /* ================= เวลาเดินหน้า 1 สัปดาห์ ================= */

  advanceWeek() {
    const s = this.state;
    const msgs = [];

    /* รายรับ-รายจ่าย */
    const income = this.sponsorIncome() + this.shopIncome();
    const salary = this.totalSalary();
    s.money += income - salary;
    if (s.money < 0) { s.money = 0; s.morale = Math.max(0, s.morale - 5); msgs.push('💸 เงินหมด! ค้างค่าเหนื่อยนักกีฬา กำลังใจลด'); }

    /* ฟื้นตัวเล็กน้อยตามธรรมชาติ + สิ่งปลูกสร้าง */
    const spa = this.facilityLevel('spa'), canteen = this.facilityLevel('canteen');
    for (const p of s.players) p.cond = Math.min(100, p.cond + 6 + spa * 4);
    s.morale = Math.min(100, s.morale + 1 + canteen * 3);

    /* แฟนคลับเพิ่มเองช้าๆ ตามชื่อเสียง */
    const fanGrow = Math.floor(1 + s.fans * 0.002 + this.facilityLevel('shop') * 3);
    s.fans += fanGrow;

    /* อีเวนต์สุ่ม */
    if (R.chance(0.22)) {
      const ev = R.pick(DATA.events);
      this.applyEvent(ev, msgs);
    }

    /* เดินปฏิทิน */
    s.week++;
    if (s.week > 4) {
      s.week = 1; s.month++;
      if (s.month > 12) { s.month = 1; s.year++; msgs.push(`🎆 ขึ้นปีที่ ${s.year} แล้ว! คู่แข่งทั่วประเทศแข็งแกร่งขึ้น`); }
    }

    const t = this.monthTournament();
    if (t && s.week === 1) msgs.push(`${t.icon} เดือนนี้มีศึก "${t.name}"! เข้าร่วมได้จากหน้าหลัก`);

    msgs.push(`📊 รายรับ ${this.fmtMoney(income)} · ค่าเหนื่อย ${this.fmtMoney(salary)}`);
    this.save();
    return { income, salary, msgs, fanGrow };
  },

  applyEvent(ev, msgs) {
    const s = this.state;
    let txt = `${ev.icon} ${ev.text}`;
    if (ev.money) { s.money = Math.max(0, s.money + ev.money); }
    if (ev.moneyPerFan) { const m = Math.max(ev.moneyMin || 0, Math.floor(s.fans * ev.moneyPerFan)); s.money += m; txt += ` (+${this.fmtMoney(m)})`; }
    if (ev.morale) s.morale = Math.min(100, Math.max(0, s.morale + ev.morale));
    if (ev.chem) s.chem = Math.min(100, Math.max(0, s.chem + ev.chem));
    if (ev.cond) for (const p of s.players) p.cond = Math.min(100, Math.max(0, p.cond + ev.cond));
    if (ev.fansPct) { const f = Math.max(ev.fansMin || 0, Math.floor(s.fans * ev.fansPct)); s.fans += f; txt += ` (+แฟนคลับ ${this.fmtNum(f)})`; }
    if (ev.statUp) {
      const p = R.pick(s.players);
      const k = R.pick(['srv', 'atk', 'blk', 'rcv', 'set', 'sta']);
      p.stats[k] = Math.min(99, p.stats[k] + ev.statUp);
      txt += ` (${p.name}: ${DATA.statNames[k]} +${ev.statUp})`;
    }
    if (ev.scoutSale) s.scoutDiscount = true;
    this.pushLog(txt);
    msgs.push(txt);
  },

  /* ================= ทัวร์นาเมนต์ ================= */

  monthTournament() {
    const s = this.state;
    return DATA.tournaments.find(t =>
      t.month === s.month &&
      s.year >= t.minYear &&
      this.tournamentUnlocked(t) &&
      !(s.played[s.year] || []).includes(t.id)
    ) || null;
  },

  tournamentUnlocked(t) {
    if (!t.unlock) return true;
    return this.state.trophies.some(tr => tr.tid === t.unlock);
  },

  nextTournament() {
    const s = this.state;
    let best = null;
    for (const t of DATA.tournaments) {
      if (!this.tournamentUnlocked(t)) continue;
      for (let off = 0; off <= 12; off++) {
        let m = s.month + off, y = s.year;
        while (m > 12) { m -= 12; y++; }
        if (t.month === m && y >= t.minYear && !(s.played[y] || []).includes(t.id)) {
          if (off === 0 && s.week > 4) continue;
          if (!best || off < best.off) best = { t, off };
          break;
        }
      }
    }
    return best;
  },

  startTournament(tid) {
    const t = DATA.tournaments.find(x => x.id === tid);
    if (!t) return null;
    const s = this.state;
    const rounds = Math.log2(t.teams);           /* 4 ทีม = 2 รอบ, 8 ทีม = 3 รอบ */
    const names = R.shuffle(DATA.rivals[t.tier].teams);
    const opponents = [];
    for (let rIdx = 0; rIdx < rounds; rIdx++) {
      /* คู่แข่งรอบแรกอยู่ขอบล่างของระดับ รอบลึกแข็งขึ้นเรื่อยๆ */
      const power = Math.min(95, this.tourRoundPower(t, rIdx) + R.int(-2, 2));
      opponents.push(this.buildRivalTeam(names[rIdx], power));
    }
    s.tour = { tid, round: 0, rounds, opponents: opponents, out: false };
    (s.played[s.year] = s.played[s.year] || []).push(tid);
    this.pushLog(`${t.icon} เข้าร่วมศึก "${t.name}"!`);
    this.save();
    return s.tour;
  },

  tourRoundPower(t, rIdx) {
    const [lo, hi] = DATA.rivals[t.tier].power;
    const rounds = Math.log2(t.teams);
    const yearBoost = Math.min(18, (this.state.year - 1) * 4);
    return Math.round(lo + ((hi - lo) * rIdx) / rounds + yearBoost);
  },

  /* ช่วงพลังคู่แข่งจริงของรายการนี้ (รวมความแข็งแกร่งตามปี) ไว้โชว์ก่อนสมัคร */
  tourPowerRange(t) {
    const rounds = Math.log2(t.teams);
    return [this.tourRoundPower(t, 0), this.tourRoundPower(t, rounds - 1)];
  },

  tourInfo() {
    const s = this.state;
    if (!s.tour) return null;
    const t = DATA.tournaments.find(x => x.id === s.tour.tid);
    const roundNames = s.tour.rounds === 2 ? ['รอบรองชนะเลิศ', 'รอบชิงชนะเลิศ'] : ['รอบแรก', 'รอบรองชนะเลิศ', 'รอบชิงชนะเลิศ'];
    return { t, tour: s.tour, roundName: roundNames[s.tour.round] || 'รอบพิเศษ', opponent: s.tour.opponents[s.tour.round] };
  },

  /* บันทึกผลหนึ่งแมตช์ในทัวร์นาเมนต์ → คืนสถานะ ('next'|'champion'|'out') */
  tourMatchDone(won) {
    const s = this.state;
    const info = this.tourInfo();
    if (!info) return 'none';
    const { t, tour } = info;
    if (!won) {
      tour.out = true;
      const finish = tour.round === tour.rounds - 1 ? 'รองแชมป์' : (tour.round === tour.rounds - 2 ? 'รอบรองชนะเลิศ' : 'รอบแรก');
      this._recordFinish(t, finish);
      const consolation = Math.floor(t.reward * 0.15 * (tour.round + 1) / tour.rounds);
      s.money += consolation;
      s.fans += Math.floor(t.fans * 0.15);
      s.tour = null;
      this.pushLog(`😢 ตกรอบ${finish === 'รองแชมป์' ? 'ชิงฯ ได้รองแชมป์' : ''} "${t.name}" (ปลอบใจ ${this.fmtMoney(consolation)})`);
      const weekly = this.advanceWeek();
      return { status: 'out', finish, consolation, weekly };
    }
    tour.round++;
    if (tour.round >= tour.rounds) {
      /* แชมป์! */
      this._recordFinish(t, 'ชนะเลิศ');
      s.trophies.push({ tid: t.id, year: s.year });
      s.money += t.reward;
      s.fans += t.fans;
      s.morale = Math.min(100, s.morale + 20);
      if (t.id === 'world') s.worldChampion = true;
      s.tour = null;
      this.pushLog(`🏆 คว้าแชมป์ "${t.name}"! (+${this.fmtMoney(t.reward)}, +แฟนคลับ ${this.fmtNum(t.fans)})`);
      const weekly = this.advanceWeek();
      return { status: 'champion', t, weekly };
    }
    this.save();
    return { status: 'next', info: this.tourInfo() };
  },

  _recordFinish(t, finish) {
    const rankOrder = ['รอบแรก', 'รอบรองชนะเลิศ', 'รองแชมป์', 'ชนะเลิศ'];
    const cur = this.state.bestFinish[t.id];
    if (!cur || rankOrder.indexOf(finish) > rankOrder.indexOf(cur)) this.state.bestFinish[t.id] = finish;
  },

  /* ================= สร้างทีมสำหรับแข่ง ================= */

  buildRivalTeam(name, power) {
    const positions = ['S', 'OH', 'OH', 'MB', 'MB', 'OP'];
    const used = [];
    const players = positions.map(pos => {
      const g = DATA.positions[pos].growth;
      const stats = {};
      for (const k of ['srv', 'atk', 'blk', 'rcv', 'set', 'sta']) {
        stats[k] = Math.max(5, Math.min(99, Math.round(power + R.int(-6, 6) + (g[k] ? g[k] * 1.5 : -2))));
      }
      const nm = R.pick(DATA.names.filter(n => !used.includes(n)) || DATA.names);
      used.push(nm);
      return {
        name: nm, pos, stats,
        cond: R.int(75, 100),
        skin: R.pick(DATA.skins), hair: R.pick(DATA.hairs),
      };
    });
    return { name, jersey: R.pick(DATA.rivalJerseys), players, power: Math.round(power), chem: 50, morale: 70 };
  },

  buildPracticeRival() {
    const tp = this.teamPower();
    const pools = DATA.rivals;
    let tier = 0;
    for (const k of [4, 3, 2, 1, 0]) { if (tp >= pools[k].power[0] - 4) { tier = k; break; } }
    const name = R.pick(pools[tier].teams);
    return this.buildRivalTeam(name, Math.max(12, tp + R.int(-6, 5)));
  },

  homeTeam() {
    const s = this.state;
    return {
      name: s.club,
      jersey: '#e8862e',
      players: this.starters().map(p => ({
        ref: p, name: p.name, pos: p.pos,
        stats: { ...p.stats }, cond: p.cond,
        skin: p.skin, hair: p.hair,
      })),
      chem: s.chem, morale: s.morale, isHome: true,
    };
  },

  /* ================= หลังจบแมตช์ ================= */

  giveExp(p, amt) {
    p.exp += amt;
    const ups = [];
    while (p.lv < 30 && p.exp >= this.expNeed(p.lv)) {
      p.exp -= this.expNeed(p.lv);
      p.lv++;
      const g = DATA.positions[p.pos].growth;
      const gained = {};
      /* โตตามตำแหน่ง + โบนัสพรสวรรค์ */
      for (const [k, w] of Object.entries(g)) {
        const inc = Math.max(1, Math.round(w * 0.7)) + (R.chance(p.pot * 0.12) ? 1 : 0);
        p.stats[k] = Math.min(99, p.stats[k] + inc);
        gained[k] = inc;
      }
      ups.push({ lv: p.lv, gained });
    }
    return ups;
  },

  /* result มาจาก Match: { win, homeScore, awayScore, mvpName, scorers } */
  afterMatch(result, ctx) {
    const s = this.state;
    const summary = { exp: [], money: 0, fans: 0, msgs: [] };
    const starters = this.starters();

    if (result.win) { s.record.w++; s.morale = Math.min(100, s.morale + 8); }
    else { s.record.l++; s.morale = Math.max(0, s.morale - 6); }
    s.chem = Math.min(100, s.chem + (result.win ? 3 : 1));

    for (const p of starters) {
      const isMvp = result.mvpName === p.name;
      const exp = (result.win ? 40 : 18) + R.int(0, 10) + (isMvp ? 20 : 0);
      const ups = this.giveExp(p, exp);
      p.cond = Math.max(0, p.cond - R.int(12, 18));
      summary.exp.push({ p, exp, ups, isMvp });
    }

    if (ctx.kind === 'practice') {
      const oppPower = ctx.opponent.power;
      if (result.win) {
        summary.money = 400 + oppPower * 12;
        summary.fans = R.int(15, 40) + Math.floor(oppPower / 4);
      } else {
        summary.money = 150;
        summary.fans = R.int(3, 10);
      }
      s.money += summary.money;
      s.fans += summary.fans;
      this.pushLog(result.win
        ? `✅ ชนะนัดอุ่นเครื่องกับ ${ctx.opponent.name} ${result.homeScore}-${result.awayScore}`
        : `❌ แพ้นัดอุ่นเครื่องกับ ${ctx.opponent.name} ${result.homeScore}-${result.awayScore}`);
    } else if (ctx.kind === 'tour') {
      this.pushLog(result.win
        ? `✅ ชนะ ${ctx.opponent.name} ${result.homeScore}-${result.awayScore} (${ctx.roundName})`
        : `❌ แพ้ ${ctx.opponent.name} ${result.homeScore}-${result.awayScore} (${ctx.roundName})`);
    }
    this.save();
    return summary;
  },
};


/* ===== match.js ===== */
/* =============================================================
   match.js — จำลองการแข่งขันทีละแรลลี่ + วาดแอนิเมชันบน canvas
   ใช้: Match.play({ home, away, pointsTo, label, onEnd })
   ============================================================= */
'use strict';

const Match = {
  cv: null, ctx: null,
  frame: 0, speed: 1, skip: false, playing: false,
  scene: null, crowdSeed: 1,

  /* ตำแหน่งยืนบนคอร์ท (ฝั่งซ้าย) — [x, y] แถวหน้าใกล้เน็ต 3 คน แถวหลัง 3 คน */
  slotsL: [[160, 122], [150, 152], [160, 186], [80, 118], [64, 152], [80, 188]],

  els() {
    return {
      overlay: document.getElementById('matchOverlay'),
      homeName: document.getElementById('mhHomeName'),
      awayName: document.getElementById('mhAwayName'),
      homeScore: document.getElementById('mhHomeScore'),
      awayScore: document.getElementById('mhAwayScore'),
      label: document.getElementById('mhLabel'),
      comment: document.getElementById('matchComment'),
      btnSpeed: document.getElementById('btnSpeed'),
      btnSkip: document.getElementById('btnSkip'),
    };
  },

  /* ---------- คำนวณค่าพลังจริงตามความสดชื่น/กำลังใจ/ความเข้าขา ---------- */
  effTeam(team) {
    const moraleF = 0.92 + 0.16 * ((team.morale ?? 70) / 100);
    const chemF = 0.92 + 0.16 * ((team.chem ?? 50) / 100);
    /* ฟอร์มประจำแมตช์: วันดีวันร้าย เปิดโอกาสให้ทีมรองล้มยักษ์ */
    const formF = 0.86 + Math.random() * 0.28;
    return {
      ...team,
      eff: team.players.map(p => {
        const condF = 0.8 + 0.2 * ((p.cond ?? 90) / 100);
        const f = condF * moraleF * chemF * formF;
        return {
          name: p.name, pos: p.pos, skin: p.skin, hair: p.hair,
          srv: p.stats.srv * f, atk: p.stats.atk * f, blk: p.stats.blk * f,
          rcv: p.stats.rcv * f, set: p.stats.set * f, sta: p.stats.sta * f,
        };
      }),
      serveIdx: 0,
    };
  },

  pickWeighted(players, key, exceptIdx = -1) {
    let total = 0;
    const ws = players.map((p, i) => {
      const w = i === exceptIdx ? 0 : Math.max(1, p[key]);
      total += w;
      return w;
    });
    let r = Math.random() * total;
    for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0) return i; }
    return 0;
  },
  bestIdx(players, key) {
    let bi = 0;
    players.forEach((p, i) => { if (p[key] > players[bi][key]) bi = i; });
    return bi;
  },

  /* ---------- จำลอง 1 แรลลี่ → รายการเหตุการณ์สำหรับแอนิเมชัน ---------- */
  simRally(A, B, servingSide) {
    const S = servingSide === 'A' ? A : B;
    const O = servingSide === 'A' ? B : A;
    const sSide = servingSide, oSide = servingSide === 'A' ? 'B' : 'A';
    const ev = [];
    const srvIdx = S.serveIdx % 6;
    S.serveIdx++;
    const server = S.eff[srvIdx];

    ev.push({ t: 'serve', side: sSide, i: srvIdx, name: server.name });
    const sq = server.srv * (0.65 + Math.random() * 0.75);
    const errRate = Math.max(0.02, 0.11 - server.srv * 0.0008);
    if (Math.random() < errRate) {
      ev.push({ t: 'serveError', side: sSide, i: srvIdx });
      return { winner: oSide, reason: 'serveError', scorer: null, ev };
    }
    const rcvIdx = this.pickWeighted(O.eff, 'rcv');
    const rq = O.eff[rcvIdx].rcv * (0.7 + Math.random() * 0.6);
    ev.push({ t: 'serveFly', from: { side: sSide, i: srvIdx }, to: { side: oSide, i: rcvIdx } });
    if (sq > rq * 1.45) {
      ev.push({ t: 'ace', side: sSide });
      return { winner: sSide, reason: 'ace', scorer: server.name, ev };
    }

    /* แรลลี่โต้กันไปมา */
    let atkTeam = O, atkSide = oSide, defTeam = S, defSide = sSide;
    let lastRcv = rcvIdx;
    for (let touch = 0; touch < 8; touch++) {
      const setIdx = this.bestIdx(atkTeam.eff, 'set');
      const atkIdx = this.pickWeighted(atkTeam.eff, 'atk', setIdx);
      const atk = atkTeam.eff[atkIdx], setter = atkTeam.eff[setIdx];
      ev.push({ t: 'receive', side: atkSide, i: lastRcv, name: atkTeam.eff[lastRcv].name });
      ev.push({ t: 'set', side: atkSide, i: setIdx, name: setter.name });
      ev.push({ t: 'spike', side: atkSide, i: atkIdx, name: atk.name });

      const fatigue = Math.max(0.75, 1 - touch * 0.035);
      const aq = (0.6 * atk.atk + 0.25 * setter.set + 0.15 * atk.sta) * (0.7 + Math.random() * 0.65) * fatigue;
      const blkIdx = this.bestIdx(defTeam.eff, 'blk');
      const digIdx = this.pickWeighted(defTeam.eff, 'rcv');
      const dq = (0.45 * defTeam.eff[blkIdx].blk + 0.55 * defTeam.eff[digIdx].rcv) * (0.7 + Math.random() * 0.6);
      const atkErr = Math.max(0.02, 0.085 - atk.atk * 0.0005);

      if (Math.random() < atkErr) {
        ev.push({ t: 'atkError', side: atkSide, i: atkIdx });
        return { winner: defSide, reason: 'atkError', scorer: null, ev };
      }
      const killTh = 1.12 - touch * 0.05;   /* ยิ่งแรลลี่ยาว ยิ่งปิดแต้มง่ายขึ้น */
      if (aq > dq * killTh) {
        ev.push({ t: 'kill', side: atkSide, i: atkIdx, blockerI: blkIdx });
        return { winner: atkSide, reason: 'kill', scorer: atk.name, ev };
      }
      if (dq > aq * 1.5 && Math.random() < 0.45) {
        ev.push({ t: 'blocked', side: defSide, i: blkIdx, atkI: atkIdx, name: defTeam.eff[blkIdx].name });
        return { winner: defSide, reason: 'block', scorer: defTeam.eff[blkIdx].name, ev };
      }
      /* ป้องกันไว้ได้ สลับฝั่งบุก */
      ev.push({ t: 'dig', side: defSide, i: digIdx, atkI: atkIdx, atkSide, name: defTeam.eff[digIdx].name });
      lastRcv = digIdx;
      [atkTeam, defTeam] = [defTeam, atkTeam];
      [atkSide, defSide] = [defSide, atkSide];
    }
    /* แรลลี่ยาวสุดๆ: สุ่มผู้ชนะตามพลังรุกรวม */
    const aPow = A.eff.reduce((x, p) => x + p.atk, 0);
    const bPow = B.eff.reduce((x, p) => x + p.atk, 0);
    const winner = Math.random() < aPow / (aPow + bPow) ? 'A' : 'B';
    ev.push({ t: 'longRally', side: winner });
    return { winner, reason: 'rally', scorer: null, ev };
  },

  /* ---------- ตัวช่วยแอนิเมชัน ---------- */
  slotPos(side, i) {
    const [x, y] = this.slotsL[i];
    return side === 'A' ? { x, y } : { x: 384 - x, y };
  },

  async wait(ms) {
    if (this.skip) return;
    await new Promise(r => setTimeout(r, ms / this.speed));
  },

  /* บอลลอยจาก a ไป b พร้อมวาดฉากทุกเฟรม
     h0/h1 = ความสูงต้น/ปลายทาง (ลูกที่จบแต้มให้ h1 = 0 จะได้ตกถึงพื้นจริง) */
  async flight(a, b, peak, dur, h0 = 12, h1 = 12) {
    const sc = this.scene;
    if (this.skip) { sc.ball = { x: b.x, y: b.y, h: h1, show: true }; return; }
    const t0 = performance.now();
    const total = dur / this.speed;
    return new Promise(res => {
      const step = (now) => {
        if (this.skip) { sc.ball = { x: b.x, y: b.y, h: h1, show: true }; res(); return; }
        const t = Math.min(1, (now - t0) / total);
        sc.ball = {
          x: a.x + (b.x - a.x) * t,
          y: a.y + (b.y - a.y) * t,
          h: h0 + (h1 - h0) * t + Math.sin(t * Math.PI) * peak,
          show: true,
        };
        this.render();
        if (t >= 1) res(); else requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  },

  say(kind, name) {
    const lines = DATA.commentary[kind];
    if (!lines) return;
    const txt = R.pick(lines).replace('{p}', name || '');
    const el = this.els().comment;
    if (el) el.textContent = '🏐 ' + txt;
  },

  setPose(side, i, pose) { this.scene.poses[side][i] = pose; },
  resetPoses() {
    for (const s of ['A', 'B']) for (let i = 0; i < 6; i++) this.scene.poses[s][i] = i < 3 ? 'idle' : 'ready';
  },

  render() {
    const ctx = this.ctx;
    if (!ctx) return;
    this.frame++;
    Sprites.drawCourt(ctx, this.frame, this.crowdSeed);
    const sc = this.scene;
    /* วาดผู้เล่นเรียงจากแถวบนก่อนเพื่อการซ้อนที่ถูกต้อง */
    const order = [];
    for (const side of ['A', 'B']) {
      for (let i = 0; i < 6; i++) {
        const pos = this.slotPos(side, i);
        order.push({ side, i, pos });
      }
    }
    order.sort((a, b) => a.pos.y - b.pos.y);
    for (const o of order) {
      const team = o.side === 'A' ? sc.home : sc.away;
      const p = team.eff[o.i];
      Sprites.drawPlayer(ctx, o.pos.x, o.pos.y, sc.poses[o.side][o.i], {
        skin: p.skin, hair: p.hair, jersey: team.jersey,
        flip: o.side === 'B', frame: this.frame + o.i * 7,
      });
    }
    if (sc.ball && sc.ball.show) Sprites.drawBall(ctx, sc.ball.x, sc.ball.y, sc.ball.h);
    if (sc.flash) {
      ctx.fillStyle = 'rgba(43,35,32,.75)';
      ctx.fillRect(112, 96, 160, 26);
      ctx.fillStyle = '#f7ecd2';
      ctx.font = 'bold 13px Tahoma, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(sc.flash, 192, 113);
      ctx.textAlign = 'left';
    }
  },

  updateScore() {
    const e = this.els();
    e.homeScore.textContent = this.scoreA;
    e.awayScore.textContent = this.scoreB;
  },

  /* ---------- เล่นแอนิเมชันตามเหตุการณ์ของแรลลี่ ---------- */
  async playRallyEvents(rally) {
    const sc = this.scene;
    this.resetPoses();
    sc.ball = null;
    for (const e of rally.ev) {
      if (this.skip) break;
      switch (e.t) {
        case 'serve': {
          const p = this.slotPos(e.side, e.i);
          this.setPose(e.side, e.i, 'serve');
          this.say('serve', e.name);
          sc.ball = { x: p.x, y: p.y, h: 20, show: true };
          this.render();
          await this.wait(550);
          Sound.hit();
          break;
        }
        case 'serveFly': {
          const a = this.slotPos(e.from.side, e.from.i);
          const b = this.slotPos(e.to.side, e.to.i);
          this.setPose(e.to.side, e.to.i, 'ready');
          await this.flight(a, b, 60, 700);
          break;
        }
        case 'serveError': {
          const a = this.slotPos(e.side, e.i ?? 0);
          Sound.hit();
          await this.flight({ x: a.x, y: a.y }, { x: 192, y: 150 }, 30, 500, 20, 0);
          this.say('serveError');
          Sound.bounce();
          await this.wait(650);
          break;
        }
        case 'ace': {
          this.say('ace');
          Sound.bounce();
          await this.wait(650);
          break;
        }
        case 'receive': {
          this.setPose(e.side, e.i, 'ready');
          this.say('receive', e.name);
          Sound.hit();
          await this.wait(220);
          break;
        }
        case 'set': {
          const from = this.slotPos(e.side, this._lastTouch ?? 0);
          const to = this.slotPos(e.side, e.i);
          this.setPose(e.side, e.i, 'set');
          await this.flight(from, to, 34, 420);
          this.say('set', e.name);
          Sound.hit();
          break;
        }
        case 'spike': {
          const setIdx = this.scene.poses[e.side].indexOf('set');
          const from = this.slotPos(e.side, setIdx >= 0 ? setIdx : e.i);
          const to = this.slotPos(e.side, e.i);
          await this.flight(from, to, 40, 380);
          this.setPose(e.side, e.i, 'spike');
          this.say('spike', e.name);
          Sound.hit();
          this._lastSpike = { side: e.side, i: e.i };
          await this.wait(140);
          break;
        }
        case 'kill': {
          const from = this.slotPos(e.side, e.i);
          const oside = e.side === 'A' ? 'B' : 'A';
          const target = { x: oside === 'A' ? 60 + Math.random() * 90 : 234 + Math.random() * 90, y: 120 + Math.random() * 70 };
          this.setPose(oside, e.blockerI, 'block');
          await this.flight(from, target, 26, 300, 22, 0);
          Sound.bounce();
          this.say('kill');
          await this.wait(650);
          break;
        }
        case 'blocked': {
          const atkSide = e.side === 'A' ? 'B' : 'A';
          const from = this.slotPos(atkSide, e.atkI);
          this.setPose(e.side, e.i, 'block');
          await this.flight(from, { x: from.x, y: from.y + 8 }, 30, 300, 22, 0);
          Sound.hit();
          this.say('blocked');
          Sound.bounce();
          await this.wait(650);
          break;
        }
        case 'atkError': {
          const from = this.slotPos(e.side, e.i);
          const oside = e.side === 'A' ? 'B' : 'A';
          const out = { x: oside === 'A' ? 20 : 364, y: 205 };
          await this.flight(from, out, 45, 450, 22, 0);
          this.say('atkError');
          Sound.bounce();
          await this.wait(650);
          break;
        }
        case 'dig': {
          const from = this.slotPos(e.atkSide, e.atkI);
          const to = this.slotPos(e.side, e.i);
          this.setPose(e.side, e.i, 'ready');
          this.setPose(e.atkSide, e.atkI, 'idle');   /* ตัวตบลงพื้นแล้ว ไม่ค้างท่ากลางอากาศ */
          await this.flight(from, to, 34, 420);
          this.say('dig');
          Sound.hit();
          this._lastTouch = e.i;
          await this.wait(160);
          break;
        }
        case 'longRally': {
          await this.wait(300);
          break;
        }
      }
      if (e.t === 'receive') this._lastTouch = e.i;
    }
  },

  /* ---------- เล่นทั้งแมตช์ ---------- */
  async play({ home, away, pointsTo = 15, label = 'แมตช์', onEnd }) {
    if (this.playing) return;
    this.playing = true;
    this.skip = false;
    this.speed = 1;
    this.crowdSeed = R.int(2, 99999);

    this.cv = document.getElementById('matchCanvas');
    this.ctx = this.cv.getContext('2d');
    const e = this.els();
    const gameRoot = document.getElementById('gameRoot');
    try { if (gameRoot) gameRoot.inert = true; } catch (err) { /* เบราว์เซอร์เก่า: ข้าม */ }
    e.overlay.hidden = false;
    try {
    e.homeName.textContent = home.name;
    e.awayName.textContent = away.name;
    e.label.textContent = label;
    e.btnSpeed.textContent = '⏩ x1';
    e.btnSkip.textContent = '⏭ ข้ามไปดูผล';
    e.btnSkip.disabled = false;

    e.btnSpeed.onclick = () => {
      this.speed = this.speed >= 4 ? 1 : this.speed * 2;
      e.btnSpeed.textContent = '⏩ x' + this.speed;
      Sound.click();
    };
    e.btnSkip.onclick = () => { this.skip = true; e.btnSkip.disabled = true; Sound.click(); };

    const A = this.effTeam(home);
    const B = this.effTeam(away);
    this.scene = {
      home: A, away: B,
      poses: { A: Array(6).fill('idle'), B: Array(6).fill('idle') },
      ball: null, flash: null,
    };
    this.scoreA = 0; this.scoreB = 0;
    this.updateScore();
    this.render();

    Sound.whistle();
    this.say('serve', A.eff[0].name);
    await this.wait(600);

    /* นับแต้มฝั่งเราจากคนทำแต้ม เพื่อหา MVP */
    const ourScorers = {};
    let serving = 'A';
    let guard = 0;
    while (guard++ < 200) {
      const rally = this.simRally(A, B, serving);
      await this.playRallyEvents(rally);
      if (rally.winner === 'A') this.scoreA++; else this.scoreB++;
      if (rally.winner === 'A' && rally.scorer) ourScorers[rally.scorer] = (ourScorers[rally.scorer] || 0) + 1;
      serving = rally.winner;
      this.updateScore();
      if (!this.skip) { if (rally.winner === 'A') Sound.point(); else Sound.losePoint(); }

      const a = this.scoreA, b = this.scoreB;
      const over = (Math.max(a, b) >= pointsTo && Math.abs(a - b) >= 2) || Math.max(a, b) >= pointsTo + 4;
      if (over) break;
      if (!this.skip) {
        this.resetPoses();          /* จบแต้มแล้ว ทุกคนกลับท่ายืนปกติ */
        this.scene.ball = null;
        this.scene.flash = `${a} - ${b}`;
        this.render();
        await this.wait(450);
        this.scene.flash = null;
      }
    }

    const win = this.scoreA > this.scoreB;
    let mvpName = null, mvpPts = 0;
    for (const [n, c] of Object.entries(ourScorers)) if (c > mvpPts) { mvpName = n; mvpPts = c; }

    /* ฉากจบ: ทีมชนะเฮ ทีมแพ้คอตก */
    this.skip = false;
    for (let i = 0; i < 6; i++) {
      this.setPose('A', i, win ? 'cheer' : 'sad');
      this.setPose('B', i, win ? 'sad' : 'cheer');
    }
    this.scene.ball = null;
    this.scene.flash = win ? '🎉 ชนะ!' : '😢 แพ้...';
    this.say('setWin');
    Sound.whistle();
    if (win) Sound.win(); else Sound.lose();

    /* แอนิเมชันฉลองสั้นๆ */
    const endT = performance.now();
    await new Promise(res => {
      const loop = (now) => {
        this.render();
        if (now - endT > 1600) res(); else requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    });

    const result = { win, homeScore: this.scoreA, awayScore: this.scoreB, mvpName, mvpPts };
    if (onEnd) onEnd(result);
    return result;
    } finally {
      e.overlay.hidden = true;
      this.playing = false;
      try { if (gameRoot) gameRoot.inert = false; } catch (err) { /* ข้าม */ }
    }
  },
};


/* ===== ui.js ===== */
/* =============================================================
   ui.js — หน้าจอ เมนู โมดัล และการเชื่อมทุกระบบเข้าด้วยกัน
   ============================================================= */
'use strict';

const UI = {
  tab: 'home',
  titleRaf: 0,

  esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },

  $(id) { return document.getElementById(id); },

  /* กันดับเบิลคลิกซื้อ/เซ็นซ้ำโดยไม่ตั้งใจ */
  guardClick() {
    const now = Date.now();
    if (this._busyUntil && now < this._busyUntil) return false;
    this._busyUntil = now + 350;
    return true;
  },

  /* ================= เริ่มต้น ================= */

  init() {
    /* หน้าไตเติล */
    this.$('btnContinue').hidden = !Game.hasSave();
    this.$('btnNewGame').addEventListener('click', () => { Sound.open(); this.askNewGame(); });
    this.$('btnContinue').addEventListener('click', () => {
      Sound.open();
      if (Game.load()) this.showGame();
      else { this.toast('เซฟเสียหาย เริ่มเกมใหม่นะ'); this.askNewGame(); }
    });
    this.startTitleAnim();

    /* แท็บ */
    document.querySelectorAll('#tabs .tab').forEach(btn => {
      btn.addEventListener('click', () => {
        Sound.click();
        this.tab = btn.dataset.tab;
        document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('on', b === btn));
        this.renderTab();
      });
    });
  },

  startTitleAnim() {
    const cv = this.$('titleCanvas');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    let f = 0;
    const loop = () => {
      f++;
      Sprites.drawTitle(ctx, f);
      this.titleRaf = requestAnimationFrame(loop);
    };
    loop();
  },

  askNewGame() {
    this.modal(`
      <h3>🏐 ก่อตั้งสโมสรใหม่</h3>
      <p>ตั้งชื่อสโมสรวอลเลย์บอลของคุณ</p>
      <input id="clubNameInput" class="txt" maxlength="18" value="วอลเลย์คลับ" autocomplete="off">
      <p class="hint">เริ่มจากทีมเล็กๆ ในชุมชน ฝึกซ้อม เก็บแชมป์ แล้วก้าวสู่เวทีโลก!</p>
      <div class="modal-btns">
        <button class="btn alt" data-act="go">เริ่มต้นตำนาน!</button>
        <button class="btn ghost" data-act="close">ยกเลิก</button>
      </div>
    `, box => {
      const input = box.querySelector('#clubNameInput');
      input.focus(); input.select();
      box.querySelector('[data-act=go]').addEventListener('click', () => {
        const name = input.value.trim() || 'วอลเลย์คลับ';
        Game.newGame(name);
        this.closeModal();
        this.showGame();
        Sound.whistle();
      });
    });
  },

  showGame() {
    cancelAnimationFrame(this.titleRaf);
    this.$('titleScreen').hidden = true;
    this.$('gameRoot').hidden = false;
    this.tab = 'home';
    document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === 'home'));
    this.renderAll();
    /* มีทัวร์นาเมนต์ค้างจากเซสชันก่อน (ปิดหน้ากลางแข่ง) → ชวนแข่งต่อทันที */
    if (Game.state.tour) this.promptResumeTournament();
  },

  backToTitle() {
    this.$('gameRoot').hidden = true;
    this.$('titleScreen').hidden = false;
    this.$('btnContinue').hidden = !Game.hasSave();
    this.startTitleAnim();
  },

  /* ================= เรนเดอร์หลัก ================= */

  renderAll() { this.renderTop(); this.renderTab(); },

  renderTop() {
    const s = Game.state;
    this.$('tbClub').textContent = '🏐 ' + s.club;
    this.$('tbDate').textContent = `📅 ปี ${s.year} ด.${s.month} สป.${s.week}`;
    this.$('tbMoney').textContent = '💰 ' + Game.fmtMoney(s.money);
    this.$('tbFans').textContent = '💛 ' + Game.fmtNum(s.fans);
  },

  renderTab() {
    const map = { home: 'renderHome', team: 'renderTeam', club: 'renderClub', honor: 'renderHonor', system: 'renderSystem' };
    this[map[this.tab] || 'renderHome']();
  },

  bar(val, max, cls = '') {
    const pct = Math.max(0, Math.min(100, (val / max) * 100));
    return `<div class="bar ${cls}"><i style="width:${pct}%"></i></div>`;
  },

  /* ---------- หน้าหลัก ---------- */
  renderHome() {
    const s = Game.state;
    const mt = Game.monthTournament();
    const nt = Game.nextTournament();
    const cands = s.pendingCandidates;
    const avgCond = Math.round(s.players.reduce((a, p) => a + p.cond, 0) / s.players.length);

    let tourBanner = '';
    if (s.tour) {
      const ti = Game.tourInfo();
      tourBanner = `
        <div class="banner hot">
          <div>${ti.t.icon} <b>ศึก "${this.esc(ti.t.name)}" ยังไม่จบ!</b><br>
          <small>ค้างอยู่ที่${ti.roundName} — ลุยต่อเลย</small></div>
          <button class="btn alt" id="btnResumeTour">🏐 แข่งต่อ</button>
        </div>`;
    } else if (mt) {
      tourBanner = `
        <div class="banner hot">
          <div>${mt.icon} <b>เดือนนี้มีศึก "${this.esc(mt.name)}"!</b><br>
          <small>รางวัลชนะเลิศ ${Game.fmtMoney(mt.reward)} · แฟนคลับ +${Game.fmtNum(mt.fans)}</small></div>
          <button class="btn alt" id="btnEnterTour">🔥 เข้าร่วม</button>
        </div>`;
    } else if (nt) {
      tourBanner = `
        <div class="banner">
          <div>${nt.t.icon} ศึกถัดไป: <b>${this.esc(nt.t.name)}</b><br>
          <small>อีก ${nt.off} เดือน (เดือน ${nt.t.month})</small></div>
        </div>`;
    }

    this.$('screen').innerHTML = `
      ${tourBanner}
      <div class="panel">
        <div class="row3">
          <div class="stat-tile"><small>พลังทีม</small><b>${Game.teamPower()}</b></div>
          <div class="stat-tile"><small>ความเข้าขา</small><b>${s.chem}</b>${this.bar(s.chem, 100, 'chem')}</div>
          <div class="stat-tile"><small>กำลังใจ</small><b>${s.morale}</b>${this.bar(s.morale, 100, 'mor')}</div>
        </div>
        <div class="row3">
          <div class="stat-tile"><small>ความสดชื่นเฉลี่ย</small><b>${avgCond}%</b>${this.bar(avgCond, 100, avgCond < 35 ? 'bad' : '')}</div>
          <div class="stat-tile"><small>สถิติ ชนะ-แพ้</small><b>${s.record.w}-${s.record.l}</b></div>
          <div class="stat-tile"><small>รายรับ/สัปดาห์</small><b>${Game.fmtMoney(Game.sponsorIncome() + Game.shopIncome() - Game.totalSalary())}</b></div>
        </div>
      </div>

      <div class="panel">
        <h3>📆 สัปดาห์นี้ทำอะไรดี?</h3>
        <div class="actions">
          <button class="action-card" data-act="train">🏐<b>ฝึกซ้อม</b><small>เพิ่มสเตตัสทีม</small></button>
          <button class="action-card" data-act="rest">😴<b>พักผ่อน</b><small>ฟื้นความสดชื่น</small></button>
          <button class="action-card" data-act="practice">🤝<b>นัดอุ่นเครื่อง</b><small>หาประสบการณ์</small></button>
          <button class="action-card" data-act="scout">🕵️<b>แมวมอง</b><small>${Game.fmtMoney(Game.scoutCost())} · หานักกีฬา${s.scoutDiscount ? ' <em>ลดราคา!</em>' : ''}</small></button>
        </div>
        ${cands ? `<button class="btn wide" id="btnViewCands">📋 ดูนักกีฬาที่แมวมองพบ (${cands.length})</button>` : ''}
      </div>

      <div class="panel">
        <h3>📜 ข่าวสโมสร</h3>
        <ul class="log">${s.log.slice(0, 12).map(l => `<li>${this.esc(l)}</li>`).join('')}</ul>
      </div>
    `;

    const sc = this.$('screen');
    sc.querySelector('[data-act=train]').addEventListener('click', () => this.openTrainingMenu());
    sc.querySelector('[data-act=rest]').addEventListener('click', () => this.doRest());
    sc.querySelector('[data-act=practice]').addEventListener('click', () => this.openPractice());
    sc.querySelector('[data-act=scout]').addEventListener('click', () => this.doScout());
    const bt = sc.querySelector('#btnEnterTour');
    if (bt) bt.addEventListener('click', () => this.confirmTournament(mt));
    const br = sc.querySelector('#btnResumeTour');
    if (br) br.addEventListener('click', () => { Sound.open(); this.tournamentLoop(); });
    const bc = sc.querySelector('#btnViewCands');
    if (bc) bc.addEventListener('click', () => this.showCandidates());
  },

  promptResumeTournament() {
    const ti = Game.tourInfo();
    if (!ti) { Game.state.tour = null; Game.save(); return; }
    this.modal(`
      <h3>${ti.t.icon} ศึกยังไม่จบ!</h3>
      <p>"${this.esc(ti.t.name)}" ค้างอยู่ที่<b>${ti.roundName}</b><br>คู่แข่ง: <b>${this.esc(ti.opponent.name)}</b> (พลัง ${ti.opponent.power})</p>
      <div class="modal-btns">
        <button class="btn alt" data-act="resume">🏐 แข่งต่อเลย!</button>
        <button class="btn ghost" data-act="close">เดี๋ยวก่อน (แข่งต่อได้จากหน้าหลัก)</button>
      </div>
    `, box => {
      box.querySelector('[data-act=resume]').addEventListener('click', () => {
        Sound.open();
        this.closeModal();
        this.tournamentLoop();
      });
    });
  },

  /* ---------- ฝึกซ้อม ---------- */
  openTrainingMenu() {
    Sound.open();
    const s = Game.state;
    const rows = DATA.trainings.map((t, i) => {
      const fac = DATA.facilities.find(f => f.id === t.fac);
      const lvl = Game.facilityLevel(t.fac);
      const afford = s.money >= t.cost;
      return `
        <button class="list-row ${afford ? '' : 'off'}" data-tid="${t.id}" ${afford ? '' : 'disabled'}>
          <span class="lr-icon">${t.icon}</span>
          <span class="lr-main"><b>${t.name}</b><small>${t.desc}${lvl ? ` · ${fac.icon} โบนัส +${lvl * 25}%` : ''}</small></span>
          <span class="lr-side">${Game.fmtMoney(t.cost)}</span>
        </button>`;
    }).join('');
    this.modal(`
      <h3>🏐 เลือกเมนูฝึกซ้อม</h3>
      <div class="list">${rows}</div>
      <div class="modal-btns"><button class="btn ghost" data-act="close">ยกเลิก</button></div>
    `, box => {
      box.querySelectorAll('[data-tid]').forEach(b => b.addEventListener('click', () => {
        this.closeModal();
        this.doTraining(b.dataset.tid);
      }));
    });
  },

  doTraining(tid) {
    const res = Game.actTraining(tid);
    if (!res) { this.toast('เงินไม่พอ!'); Sound.error(); return; }
    Sound.train();
    const t = res.training;
    const statList = Object.keys(t.stats).map(k => `${DATA.statIcons[k]} ${DATA.statNames[k]}`).join(' · ');
    const rows = res.results.map(r => {
      const gainTxt = Object.entries(r.gains).filter(([, v]) => v > 0).map(([k, v]) => `${DATA.statNames[k]}+${v}`).join(' ');
      const lvTxt = r.lvls.length ? ` <em class="lvup">LV UP! → ${r.p.lv}</em>` : '';
