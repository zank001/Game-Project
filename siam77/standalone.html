<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2233">
<title>สยาม 77 · Siam77</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%95%3C/text%3E%3C/svg%3E">
<style>
/* Siam77 — UI theme: dark glass panels with pixel-ish borders, warm gold accents */
:root {
  --bg: rgba(22, 26, 40, 0.86);
  --bg2: rgba(36, 42, 62, 0.95);
  --line: #4b5578;
  --gold: #f2c14e;
  --pink: #ff3b6b;
  --text: #f3efe6;
  --dim: #aab0c6;
  --good: #4caf50;
  --bad: #e5533d;
  --font: "Noto Sans Thai", "Sarabun", "Leelawadee UI", "Thonburi", "Tahoma", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1220; color: var(--text); font-family: var(--font); user-select: none; -webkit-user-select: none; }
#view { position: fixed; inset: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

.panel { background: var(--bg); border: 2px solid var(--line); border-radius: 6px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06); }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#hudTL { position: absolute; left: 10px; top: 10px; padding: 6px 12px; min-width: 150px; }
#hClock { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
#hDate { font-size: 12px; color: var(--dim); }
#hudLoc { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 5px 18px; text-align: center; max-width: 46vw; }
#hProv { font-size: 19px; font-weight: 700; color: var(--gold); white-space: nowrap; }
#hArea { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hudTR { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.money { padding: 5px 12px; font-size: 18px; font-weight: 700; color: #ffe066; }
#hRide { margin-left: 6px; }
#minimap { width: 150px; height: 110px; border: 2px solid var(--line); border-radius: 8px; background: #1f5f9a; image-rendering: pixelated; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
#hudBL { position: absolute; left: 10px; bottom: 10px; padding: 8px 10px; display: grid; gap: 5px; width: 170px; }
.need { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.nb { flex: 1; height: 10px; background: rgba(0, 0, 0, 0.45); border-radius: 3px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.12); }
.nb i { display: block; height: 100%; background: linear-gradient(#7ee08a, #3fae4f); transition: width 0.3s; }
.need:nth-child(2) .nb i { background: linear-gradient(#ffe27a, #e8b52c); }
.need:nth-child(3) .nb i { background: linear-gradient(#ffb3d0, #e9659a); }
.need:nth-child(4) .nb i { background: linear-gradient(#ff8f7a, #d9473a); }
.nb.low { animation: blink 0.8s infinite; }
@keyframes blink { 50% { border-color: #ff5a5a; box-shadow: 0 0 6px #ff5a5a; } }
#prompt { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); padding: 8px 16px; font-size: 16px; font-weight: 600; white-space: nowrap; color: var(--text); animation: pop 0.2s; }
#prompt kbd { display: inline-block; background: var(--gold); color: #222; border-radius: 4px; padding: 0 7px; margin-right: 6px; font-family: inherit; font-weight: 800; box-shadow: 0 2px 0 #9a7420; }
@keyframes pop { from { transform: translateX(-50%) scale(0.85); opacity: 0; } }
#hudBtns { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
#hudBtns button { width: 58px; height: 56px; font-size: 22px; background: var(--bg); border: 2px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
#hudBtns button span { font-size: 10px; color: var(--dim); }
#hudBtns button:hover { border-color: var(--gold); }
#hudBtns button:active { transform: translateY(2px); box-shadow: none; }
#zoomBtns { position: absolute; right: 168px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
#zoomBtns button { width: 30px; height: 30px; background: var(--bg); border: 2px solid var(--line); border-radius: 6px; font-size: 16px; }
#mobileBtns { display: none; position: absolute; right: 14px; bottom: 80px; gap: 12px; align-items: flex-end; }
#mobileBtns button { width: 64px; height: 64px; border-radius: 50%; background: var(--bg); border: 3px solid var(--line); font-size: 24px; font-weight: 800; }
#mobileBtns #bAct { width: 78px; height: 78px; font-size: 28px; }
#mobileBtns #bAct.ready { border-color: var(--gold); background: rgba(242, 193, 78, 0.3); animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 14px var(--gold); } }
#joy { display: none; position: fixed; width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.25); pointer-events: none; }
#joyKnob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); }

#toasts { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 40; width: min(92vw, 560px); }
.toast { background: var(--bg2); border: 2px solid var(--line); border-radius: 6px; padding: 7px 14px; font-size: 14px; animation: tin 0.25s; transition: opacity 0.5s, transform 0.5s; text-align: center; }
.toast.good { border-color: #4caf50; } .toast.bad { border-color: #e5533d; } .toast.info { border-color: #5d8fd0; }
.toast.out { opacity: 0; transform: translateY(-8px); }
@keyframes tin { from { opacity: 0; transform: translateY(-10px); } }
#banner { position: fixed; left: 50%; top: 26%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; z-index: 30; }
#banner .bt { font-size: clamp(34px, 7vw, 64px); font-weight: 800; color: #fff; text-shadow: 0 4px 0 #8a3a2a, 0 0 18px rgba(0, 0, 0, 0.6); letter-spacing: 2px; }
#banner .bs { font-size: 16px; color: #ffe9b0; text-shadow: 0 2px 4px #000; margin-top: 4px; }
#banner.show { animation: ban 4s forwards; }
@keyframes ban { 0% { opacity: 0; transform: translate(-50%, 12px); } 12% { opacity: 1; transform: translate(-50%, 0); } 78% { opacity: 1; } 100% { opacity: 0; } }

#fade { position: fixed; inset: 0; background: #0d1220; opacity: 0; pointer-events: none; transition: opacity 0.35s; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-size: 22px; font-weight: 700; }
#fade.on { opacity: 1; pointer-events: auto; }
.tmap { border: 2px solid var(--line); border-radius: 8px; max-width: 86vw; }
.tlab { font-size: 20px; }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; background: rgba(5, 8, 16, 0.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
.win { background: var(--bg2); border: 3px solid var(--line); border-radius: 10px; width: min(480px, 96vw); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4), 0 20px 50px rgba(0, 0, 0, 0.5); animation: win 0.18s; }
.win.wide { width: min(860px, 96vw); }
.win.mapwin { width: min(1100px, 97vw); height: 90vh; }
@keyframes win { from { transform: scale(0.94); opacity: 0; } }
.win-h { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 2px solid var(--line); background: linear-gradient(rgba(255, 255, 255, 0.05), transparent); }
.ttl { font-size: 18px; font-weight: 700; color: var(--gold); }
.win-h .x { background: none; border: 2px solid var(--line); border-radius: 6px; width: 32px; height: 32px; font-size: 16px; }
.win-b { padding: 12px 14px; overflow: auto; flex: 1; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: rgba(255, 255, 255, 0.05); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; }
.opt:hover:not(.dis) { border-color: var(--gold); background: rgba(242, 193, 78, 0.08); }
.opt.dis { opacity: 0.45; cursor: default; }
.ol { font-size: 15px; font-weight: 600; }
.os { font-size: 12px; color: var(--dim); margin-top: 2px; }
.btn { background: #3a4466; border: 2px solid #5a6690; border-radius: 6px; padding: 6px 12px; font-size: 14px; font-weight: 600; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.alt { background: #2c3350; }
.btn.on { background: var(--gold); color: #222; border-color: #c99a2a; }
.btn.big { font-size: 18px; padding: 12px 22px; background: linear-gradient(#e2574b, #b8392f); border-color: #ff8f7a; display: flex; flex-direction: column; align-items: center; }
.btn.big small { font-size: 11px; font-weight: 400; opacity: 0.85; }
.empty { color: var(--dim); font-size: 13px; padding: 8px 2px; }
.note { color: var(--dim); font-size: 12px; margin-top: 8px; }
h4 { margin: 14px 0 6px; color: var(--gold); font-size: 14px; }
.tag { font-size: 10px; background: #5d4ad0; color: #fff; padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.sw.big { width: 18px; height: 18px; border-radius: 4px; margin: 0; }
.bar { display: inline-block; width: 110px; height: 9px; background: rgba(0, 0, 0, 0.4); border-radius: 3px; overflow: hidden; vertical-align: middle; margin: 0 6px; }
.bar i { display: block; height: 100%; }

/* shop rows */
.shop { display: grid; gap: 6px; }
.shop-top { font-size: 13px; color: var(--dim); margin-bottom: 4px; }
.shop-top b { color: #ffe066; }
.row { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 6px 8px; }
.row.wrap { flex-wrap: wrap; }
.row.done { opacity: 0.6; }
.row .ic { font-size: 22px; width: 30px; text-align: center; }
.row .nm { flex: 1; font-size: 14px; display: flex; flex-direction: column; }
.row .nm small { font-size: 11px; color: var(--dim); }
.row .pr { font-weight: 700; color: #ffe066; font-size: 14px; }

/* talk */
.talkwin { width: min(640px, 96vw); }
.talk { display: flex; gap: 14px; align-items: flex-start; }
.tl { background: radial-gradient(circle at 50% 70%, #3f4a70, #232a40); border-radius: 8px; padding: 8px; border: 2px solid var(--line); }
.portrait { image-rendering: pixelated; display: block; }
.tr { flex: 1; min-width: 0; }
.tn { font-size: 18px; font-weight: 700; }
.tn small { font-size: 12px; color: var(--dim); font-weight: 400; display: block; }
.th { color: #ff7aa2; letter-spacing: 2px; margin: 2px 0 6px; }
.say { min-height: 64px; background: rgba(0, 0, 0, 0.25); border-radius: 8px; padding: 10px 12px; font-size: 16px; line-height: 1.5; }
.topts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* travel */
.search, .cin { width: 100%; background: #1b2033; border: 2px solid var(--line); border-radius: 6px; color: var(--text); padding: 8px 10px; font-size: 15px; font-family: inherit; }
.tlist { display: grid; gap: 5px; margin-top: 8px; }
.trow { display: flex; align-items: center; gap: 8px; text-align: left; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 7px 10px; }
.trow:hover { border-color: var(--gold); }
.trow .dot { width: 10px; height: 10px; border-radius: 50%; }
.trow .nm { flex: 1; display: flex; flex-direction: column; font-size: 15px; }
.trow .nm small { font-size: 11px; color: var(--dim); }
.trow .pr { color: #ffe066; font-weight: 700; }

/* province info */
.pinfo .ph { border-left: 6px solid; padding-left: 10px; margin-bottom: 10px; }
.pn { font-size: 22px; font-weight: 800; }
.pn small { font-size: 13px; color: var(--dim); font-weight: 400; }
.pt { font-size: 13px; color: var(--dim); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 13px; }
.stats { display: grid; gap: 3px; font-size: 13px; }
.iss { display: flex; align-items: center; justify-content: space-between; font-size: 13px; padding: 2px 0; }
.iss > span:first-child { flex: 1; }

/* world map */
.wmap { display: flex; gap: 10px; height: 100%; }
.mapwin .win-b { display: flex; flex-direction: column; }
.wwrap { position: relative; flex: 1; min-height: 60vh; border-radius: 8px; overflow: hidden; border: 2px solid var(--line); }
.wcv { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.wside { width: 250px; display: flex; flex-direction: column; gap: 8px; }
.wmodes { display: flex; flex-wrap: wrap; gap: 4px; }
.wmodes .btn { font-size: 12px; padding: 4px 8px; }
.winfo { font-size: 13px; display: grid; gap: 4px; align-content: start; }
.winfo .btn { margin-top: 4px; }
.wzoom { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; }

/* passport */
.pp-sum { display: grid; gap: 4px; font-size: 14px; }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.stamp { border: 2px dashed rgba(255, 255, 255, 0.18); border-radius: 8px; padding: 6px; font-size: 12px; min-height: 46px; display: flex; flex-direction: column; justify-content: space-between; color: var(--dim); }
.stamp.on { border: 2px solid var(--c); color: #fff; background: color-mix(in srgb, var(--c) 22%, transparent); transform: rotate(-1.5deg); }
.stamp.on .sn::before { content: "✔ "; color: var(--c); }
.si { font-size: 13px; }

/* status */
.status { display: flex; gap: 16px; }
.sl { display: flex; flex-direction: column; gap: 6px; background: radial-gradient(circle, #3f4a70, #232a40); padding: 10px; border-radius: 10px; align-self: flex-start; }
.sr { flex: 1; font-size: 13px; display: grid; gap: 3px; align-content: start; }
.friends { display: flex; flex-wrap: wrap; gap: 6px; }
.friends span { background: rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 3px 9px; font-size: 12px; }
.friends small { color: var(--dim); }
.help table { width: 100%; border-collapse: collapse; font-size: 14px; }
.help td { padding: 4px 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
.help td:first-child { color: var(--gold); white-space: nowrap; font-weight: 700; }
.settings { display: grid; gap: 10px; }
.srow { display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
.sch { display: flex; gap: 6px; flex-wrap: wrap; }

/* character creation */
.ccwin { width: min(820px, 96vw); }
.cc { display: flex; gap: 16px; }
.ccp { background: radial-gradient(circle at 50% 60%, #5a6a9a, #232a40); border-radius: 10px; padding: 8px; align-self: flex-start; border: 2px solid var(--line); }
.ccp canvas { display: block; image-rendering: pixelated; }
.ccf { flex: 1; display: grid; gap: 8px; }
.ccr label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { background: #2c3350; border: 2px solid #4b5578; border-radius: 6px; padding: 4px 9px; font-size: 13px; min-height: 30px; display: flex; align-items: center; }
.chip.on { border-color: var(--gold); background: #4a4126; }

/* title & loading */
#title { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; background: radial-gradient(ellipse at 50% 40%, rgba(10, 12, 24, 0.1), rgba(10, 12, 24, 0.7)); }
.logo { text-align: center; }
.l1, .ldlogo { font-size: clamp(56px, 12vw, 120px); font-weight: 900; color: #fff4d6; text-shadow: 0 6px 0 #b8392f, 0 10px 0 #5a1d18, 0 0 30px rgba(0, 0, 0, 0.6); letter-spacing: 4px; line-height: 1; }
.l1 span, .ldlogo span { color: var(--gold); margin-left: 8px; }
.l2 { margin-top: 18px; font-size: clamp(15px, 2.6vw, 22px); color: #ffe9b0; text-shadow: 0 2px 6px #000; }
.tbtns { display: flex; flex-direction: column; gap: 10px; align-items: stretch; width: min(320px, 80vw); }
.tbtns .btn:not(.big) { padding: 10px; font-size: 15px; }
.tfoot { position: absolute; bottom: 14px; font-size: 12px; color: #cfd3e6; text-shadow: 0 1px 3px #000; text-align: center; padding: 0 10px; }
#loading { position: fixed; inset: 0; z-index: 80; background: linear-gradient(#141a2e, #0d1220); display: flex; align-items: center; justify-content: center; transition: opacity 0.6s; }
#loading.done { opacity: 0; pointer-events: none; }
.ld { text-align: center; width: min(460px, 86vw); }
.ldlogo { font-size: clamp(48px, 10vw, 88px); margin-bottom: 26px; }
#ldMsg { font-size: 15px; color: var(--dim); }
.ldbar { height: 14px; background: #222a42; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; margin: 10px 0 18px; }
.ldbar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(45deg, #f2c14e 0 10px, #e2a83a 10px 20px); transition: width 0.3s; }
#ldTip { font-size: 14px; color: #ffe9b0; min-height: 40px; }

/* ---------- mobile ---------- */
@media (max-width: 760px), (pointer: coarse) {
  #mobileBtns { display: flex; }
  #hudBtns { left: 50%; right: auto; transform: translateX(-50%); bottom: 6px; gap: 4px; }
  #hudBtns button { width: 46px; height: 44px; font-size: 18px; }
  #hudBtns button span { display: none; }
  #hudBL { bottom: 58px; width: 130px; padding: 6px 8px; gap: 3px; }
  #prompt { bottom: 170px; font-size: 14px; }
  #zoomBtns { right: 128px; }
}
@media (max-width: 760px) {
  #hudTL { padding: 4px 8px; min-width: 0; }
  #hClock { font-size: 17px; }
  #hDate { font-size: 10px; }
  #hudLoc { top: 62px; left: 10px; transform: none; padding: 3px 10px; text-align: left; max-width: 58vw; }
  #hProv { font-size: 15px; }
  #minimap { width: 110px; height: 80px; }
  .money { font-size: 15px; }
  #zoomBtns { display: none; }
  .wmap, .cc, .status, .talk { flex-direction: column; }
  .wside { width: auto; }
  .wwrap { min-height: 50vh; }
  .grid2 { grid-template-columns: 1fr; }
  .bar { width: 80px; }
}

</style>
</head>
<body>
<canvas id="view"></canvas>

<!-- HUD -->
<div id="hud" hidden>
  <div id="hudTL" class="panel">
    <div id="hClock">☀️ 07:00</div>
    <div id="hDate"></div>
  </div>
  <div id="hudLoc" class="panel">
    <div id="hProv"></div>
    <div id="hArea"></div>
  </div>
  <div id="hudTR">
    <div class="panel money"><span id="hMoney">฿0</span><span id="hRide"></span></div>
    <canvas id="minimap" width="150" height="110"></canvas>
  </div>
  <div id="hudBL" class="panel needs">
    <div class="need"><span>🍚</span><div class="nb"><i id="nHunger"></i></div></div>
    <div class="need"><span>⚡</span><div class="nb"><i id="nEnergy"></i></div></div>
    <div class="need"><span>😊</span><div class="nb"><i id="nMood"></i></div></div>
    <div class="need"><span>❤️</span><div class="nb"><i id="nHealth"></i></div></div>
  </div>
  <button id="prompt" class="panel" hidden></button>
  <div id="hudBtns">
    <button id="bMap" title="แผนที่ (M)">🗺️<span>แผนที่</span></button>
    <button id="bInv" title="กระเป๋า (I)">🎒<span>กระเป๋า</span></button>
    <button id="bPass" title="พาสปอร์ต (P)">📮<span>พาสปอร์ต</span></button>
    <button id="bQuest" title="ภารกิจ (J)">📝<span>ภารกิจ</span></button>
    <button id="bStat" title="ตัวละคร (C)">👤<span>ตัวละคร</span></button>
    <button id="bMenu" title="เมนู (Esc)">☰<span>เมนู</span></button>
  </div>
  <div id="zoomBtns"><button id="bZoomIn">＋</button><button id="bZoomOut">－</button></div>
  <div id="mobileBtns"><button id="bRide">🚲</button><button id="bAct">E</button></div>
  <div id="joy"><div id="joyKnob"></div></div>
</div>
<div id="toasts"></div>
<div id="banner"></div>

<!-- modal window -->
<div id="modal" hidden>
  <div class="win"><div class="win-h"><span class="ttl"></span><button class="x" aria-label="ปิด">✕</button></div><div class="win-b"></div></div>
</div>
<div id="fade"></div>

<!-- title -->
<div id="title" hidden>
  <div class="logo">

/* ===== js/util.js ===== */
/* util.js — namespace, math, RNG, noise, event bus, pixel buffer, storage.
   Every other file attaches to the global `S77` namespace (no ES modules so the
   game also runs from file:// and from the bundled standalone.html). */
'use strict';
const S77 = (globalThis.S77 = globalThis.S77 || {});

/* ---------------- math ---------------- */
const U = (S77.U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  smooth: (t) => t * t * (3 - 2 * t),
  dist: (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by),
  rnd: (a, b) => a + Math.random() * (b - a),
  pick: (arr, r) => arr[Math.floor((r === undefined ? Math.random() : r) * arr.length) % arr.length],
  fmtMoney: (n) => '฿' + Math.round(n).toLocaleString('en-US'),
  fmtNum: (n) => Math.round(n).toLocaleString('en-US'),
  pad2: (n) => (n < 10 ? '0' : '') + n,
  esc: (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
});

/* ---------------- deterministic hashing / RNG ---------------- */
// 32-bit integer hash of (x, y, seed) -> [0, 1)
U.hash2 = function (x, y, s) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (s | 0) * 2147483647;
  h = (h ^ (h >>> 13)) * 1274126177;
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
};
U.hashStr = function (str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};
// mulberry32 seeded RNG -> function returning [0,1)
U.rng = function (seed) {
  let a = seed >>> 0;
  const f = function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.int = (a0, b0) => a0 + Math.floor(f() * (b0 - a0 + 1));
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.chance = (p) => f() < p;
  return f;
};

/* ---------------- value noise / fbm ---------------- */
U.vnoise = function (x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = U.hash2(xi, yi, seed), b = U.hash2(xi + 1, yi, seed);
  const c = U.hash2(xi, yi + 1, seed), d = U.hash2(xi + 1, yi + 1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
};
U.fbm = function (x, y, seed, oct) {
  let s = 0, amp = 0.5, f = 1, n = 0;
  for (let i = 0; i < (oct || 4); i++) { s += amp * U.vnoise(x * f, y * f, seed + i * 101); n += amp; amp *= 0.5; f *= 2.03; }
  return s / n;
};

// low-frequency fbm sampled on a coarse grid + bilinear lookup (much faster for big maps)
U.noiseGrid = function (W, H, step, scale, seed, oct) {
  const gw = Math.ceil(W / step) + 2, gh = Math.ceil(H / step) + 2, g = new Float32Array(gw * gh);
  for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) g[gy * gw + gx] = U.fbm((gx * step) / scale, (gy * step) / scale, seed, oct);
  return function (x, y) {
    const fx = x / step, fy = y / step, cx = fx | 0, cy = fy | 0, tx = fx - cx, ty = fy - cy, i = cy * gw + cx;
    return (g[i] * (1 - tx) + g[i + 1] * tx) * (1 - ty) + (g[i + gw] * (1 - tx) + g[i + gw + 1] * tx) * ty;
  };
};

/* ---------------- geometry ---------------- */
U.pointInPoly = function (x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
};
U.segDist = function (px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy || 1e-9;
  let t = ((px - ax) * dx + (py - ay) * dy) / l2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
};
// Catmull-Rom resample of a polyline (array of [x,y]) -> denser polyline
U.spline = function (pts, stepsPer) {
  if (pts.length < 3) return pts.slice();
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let s = 0; s < stepsPer; s++) {
      const t = s / stepsPer, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
      ]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
};

/* ---------------- color ---------------- */
U.hex = function (h) {
  if (typeof h !== 'string') return h;
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
U.shade = function (c, f) { // f>1 lighter, <1 darker
  c = U.hex(c);
  if (f >= 1) { const t = f - 1; return [c[0] + (255 - c[0]) * t, c[1] + (255 - c[1]) * t, c[2] + (255 - c[2]) * t].map((v) => U.clamp(Math.round(v), 0, 255)); }
  return [c[0] * f, c[1] * f, c[2] * f].map((v) => U.clamp(Math.round(v), 0, 255));
};
U.mix = function (a, b, t) { a = U.hex(a); b = U.hex(b); return [0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * t)); };

/* ---------------- PixelBuffer: fast pixel painting into ImageData ---------------- */
class PixelBuffer {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.data = new Uint32Array(w * h);
  }
  static pack(c, a) { c = U.hex(c); return (((a === undefined ? 255 : a) << 24) | (c[2] << 16) | (c[1] << 8) | c[0]) >>> 0; }
  set(x, y, col) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.data[y * this.w + x] = col; }
  get(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h ? this.data[y * this.w + x] : 0; }
  rect(x, y, w, h, col) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.set(i, j, col); }
  // 1px "selective outline": transparent pixels touching opaque ones get a darkened neighbour colour
  outline(factor, onlyBelow) {
    const w = this.w, h = this.h, src = this.data.slice(), f = factor || 0.45;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (src[y * w + x] >>> 24) continue;
      let n = 0;
      if (x > 0 && src[y * w + x - 1] >>> 24) n = src[y * w + x - 1];
      else if (x < w - 1 && src[y * w + x + 1] >>> 24) n = src[y * w + x + 1];
      else if (y > 0 && src[(y - 1) * w + x] >>> 24) n = src[(y - 1) * w + x];
      else if (!onlyBelow && y < h - 1 && src[(y + 1) * w + x] >>> 24) n = src[(y + 1) * w + x];
      if (n) {
        const r = (n & 255) * f, g = ((n >> 8) & 255) * f, b = ((n >> 16) & 255) * f;
        this.data[y * w + x] = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
      }
    }
  }
  toCanvas() {
    const c = document.createElement('canvas');
    c.width = this.w; c.height = this.h;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(this.w, this.h);
    new Uint32Array(img.data.buffer).set(this.data);
    ctx.putImageData(img, 0, 0);
    return c;
  }
}
S77.PixelBuffer = PixelBuffer;

/* ---------------- Event bus (decouples systems; Phase 2 hooks in here) ---------------- */
S77.Events = {
  _h: {},
  on(ev, fn) { (this._h[ev] = this._h[ev] || []).push(fn); return () => this.off(ev, fn); },
  off(ev, fn) { const a = this._h[ev]; if (a) this._h[ev] = a.filter((f) => f !== fn); },
  emit(ev, data) { const a = this._h[ev]; if (a) for (const f of a.slice()) { try { f(data); } catch (e) { console.error('[event ' + ev + ']', e); } } },
};

/* ---------------- storage that survives sandboxed iframes / private mode ---------------- */
S77.Store = (() => {
  const mem = {};
  let ok = false;
  try { const k = '__s77_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); ok = true; } catch (e) { ok = false; }
  return {
    available: ok,
    get(k) { try { return ok ? localStorage.getItem(k) : k in mem ? mem[k] : null; } catch (e) { return k in mem ? mem[k] : null; } },
    set(k, v) { try { if (ok) localStorage.setItem(k, v); else mem[k] = v; return true; } catch (e) { mem[k] = v; return false; } },
    remove(k) { try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch (e) { delete mem[k]; } },
  };
})();

/* ===== js/worldgen.js ===== */
/* worldgen.js — deterministic generation of the 77-province world.
   Tile grid: ~1018 x 1842 tiles (≈0.9 km per tile). Layers are typed arrays:
     ter  terrain id        prov  province idx+1 (0 = none)
     obj  decoration id     bld   building id+1 occupying the tile
     elev 0..255 height     zone  town (prov idx+1) / village (100+id)
     road highway lane-direction hint for centre lines, flag bitfield */
'use strict';
(function () {
  const U = S77.U, GEO = S77.GEO;

  const T = (S77.T = {
    DEEP: 0, SEA: 1, RIVER: 2, LAKE: 3, SAND: 4, GRASS: 5, PADDY: 6, FIELD: 7, FOREST: 8, JUNGLE: 9, HILL: 10,
    MOUNTAIN: 11, PLANT: 12, ORCHARD: 13, ROAD: 14, STREET: 15, PAVE: 16, PLAZA: 17, DIRT: 18, MANGROVE: 19,
    FOREIGN: 20, BRIDGE: 21, YARD: 22, RUNWAY: 23, DRYGRASS: 24,
  });
  S77.T_NAMES = ['ทะเลลึก', 'ทะเล', 'แม่น้ำ', 'ทะเลสาบ', 'ชายหาด', 'ทุ่งหญ้า', 'ทุ่งนา', 'ไร่', 'ป่าไม้', 'ป่าดิบชื้น', 'เนินเขา', 'ภูเขา', 'สวนยาง', 'สวนผลไม้', 'ทางหลวง', 'ถนน', 'ทางเท้า', 'ลานเมือง', 'ทางดิน', 'ป่าชายเลน', 'ต่างประเทศ', 'สะพาน', 'สนามหญ้า', 'รันเวย์', 'ทุ่งหญ้าแห้ง'];
  const WATER = new Uint8Array(32);
  [T.DEEP, T.SEA, T.RIVER, T.LAKE].forEach((t) => (WATER[t] = 1));
  const NOWALK = new Uint8Array(32);
  [T.DEEP, T.SEA, T.RIVER, T.LAKE, T.MOUNTAIN, T.FOREIGN].forEach((t) => (NOWALK[t] = 1));
  const PAVED = new Uint8Array(32);
  [T.ROAD, T.STREET, T.PAVE, T.PLAZA, T.DIRT, T.BRIDGE, T.RUNWAY].forEach((t) => (PAVED[t] = 1));
  S77.isWater = (t) => WATER[t] === 1;
  S77.isPaved = (t) => PAVED[t] === 1;

  // decoration objects. block: 0 = none, 1 = small trunk collider, 2 = whole tile
  const O = (S77.O = {
    NONE: 0, TREE_RAIN: 1, TREE_PALM: 2, TREE_PINE: 3, TREE_TEAK: 4, TREE_BANANA: 5, TREE_RUBBER: 6, TREE_OILPALM: 7,
    TREE_BAMBOO: 8, TREE_MANGO: 9, TREE_JUNGLE: 10, TREE_MANGROVE: 11, TREE_GOLDEN: 12, TREE_SAKURA: 13, TREE_FLAME: 14,
    TREE_SUGARPALM: 15, BUSH: 16, FLOWERS: 17, TALLGRASS: 18, ROCK: 19, PEAK: 20, KARST: 21, LAMP: 22, SPIRIT: 23,
    POLE: 24, SCARECROW: 25, STALL: 26, BENCH: 27, HUT: 28, BOAT: 29, JAR: 30, FLAG: 31, PIER: 32, PARASOL: 33,
    TREE_DRY: 34, CORN: 35,
  });
  const OBJ_BLOCK = (S77.OBJ_BLOCK = new Uint8Array(64));
  for (let i = 1; i <= 15; i++) OBJ_BLOCK[i] = 1;
  OBJ_BLOCK[O.TREE_DRY] = 1; OBJ_BLOCK[O.ROCK] = 1; OBJ_BLOCK[O.PEAK] = 2; OBJ_BLOCK[O.KARST] = 2; OBJ_BLOCK[O.LAMP] = 1;
  OBJ_BLOCK[O.SPIRIT] = 1; OBJ_BLOCK[O.POLE] = 1; OBJ_BLOCK[O.STALL] = 2; OBJ_BLOCK[O.HUT] = 2; OBJ_BLOCK[O.JAR] = 1;
  OBJ_BLOCK[O.FLAG] = 1; OBJ_BLOCK[O.SCARECROW] = 1; OBJ_BLOCK[O.PARASOL] = 1; OBJ_BLOCK[O.BENCH] = 1;

  const F_DOOR = 1, F_NODECOR = 2;

  /* ---------------- tiny binary heap for A* ---------------- */
  class Heap {
    constructor() { this.k = []; this.v = []; this.n = 0; }
    push(key, val) {
      const k = this.k, v = this.v; let i = this.n++;
      while (i > 0) { const p = (i - 1) >> 1; if (v[p] <= val) break; k[i] = k[p]; v[i] = v[p]; i = p; }
      k[i] = key; v[i] = val;
    }
    pop() {
      const k = this.k, v = this.v, top = k[0], n = --this.n;
      if (n > 0) {
        const lk = k[n], lv = v[n]; let i = 0;
        for (;;) {
          let c = 2 * i + 1; if (c >= n) break;
          if (c + 1 < n && v[c + 1] < v[c]) c++;
          if (v[c] >= lv) break;
          k[i] = k[c]; v[i] = v[c]; i = c;
        }
        k[i] = lk; v[i] = lv;
      }
      return top;
    }
    get size() { return this.n; }
  }
  S77.Heap = Heap;

  class World {
    constructor(seed) {
      this.seed = seed || 77;
      this.TPD_Y = 120;
      this.TPD_X = 120 * Math.cos((13 * Math.PI) / 180);
      this.W = Math.ceil((GEO.LON_MAX - GEO.LON_MIN) * this.TPD_X);
      this.H = Math.ceil((GEO.LAT_MAX - GEO.LAT_MIN) * this.TPD_Y);
      this.N = this.W * this.H;
      this.buildings = [];
      this.towns = [];
      this.villages = [];
      this.pois = []; // piers etc.
      this.CH = 16; // chunk size (tiles) for spatial indexing
      this.CW = Math.ceil(this.W / this.CH);
      this.CHH = Math.ceil(this.H / this.CH);
      this.bldChunks = [];
    }
    lonToX(lon) { return (lon - GEO.LON_MIN) * this.TPD_X; }
    latToY(lat) { return (GEO.LAT_MAX - lat) * this.TPD_Y; }
    xToLon(x) { return x / this.TPD_X + GEO.LON_MIN; }
    yToLat(y) { return GEO.LAT_MAX - y / this.TPD_Y; }
    toTile(p) { return [this.lonToX(p[0]), this.latToY(p[1])]; }
    inb(x, y) { return x >= 0 && y >= 0 && x < this.W && y < this.H; }
    id(x, y) { return y * this.W + x; }

    /* ---------- public queries ---------- */
    terrain(x, y) { return this.inb(x, y) ? this.ter[y * this.W + x] : T.DEEP; }
    province(x, y) { if (!this.inb(x, y)) return null; const p = this.prov[y * this.W + x]; return p ? S77.PROVINCES[p - 1] : null; }
    blockedTile(x, y) {
      if (!this.inb(x, y)) return true;
      const i = y * this.W + x;
      if (this.bld[i]) return true;
      if (NOWALK[this.ter[i]]) return true;
      return OBJ_BLOCK[this.obj[i]] === 2;
    }
    // building lookup
    buildingAt(x, y) { if (!this.inb(x, y)) return null; const b = this.bld[y * this.W + x]; return b ? this.buildings[b - 1] : null; }
    buildingsNearChunk(cx, cy) { return (cx >= 0 && cy >= 0 && cx < this.CW && cy < this.CHH && this.bldChunks[cy * this.CW + cx]) || null; }
    zoneName(x, y) {
      if (!this.inb(x, y)) return '';
      const z = this.zone[y * this.W + x];
      if (!z) return '';
      if (z < 100) return 'ตัวเมือง' + S77.PROVINCES[z - 1].th;
      const v = this.villages[z - 100];
      return v ? v.name : '';
    }

    /* =========================================================
       GENERATION
       ========================================================= */
    async generate(progress) {
      const t0 = performance.now();
      const step = async (msg, frac, fn) => { if (progress) progress(msg, frac); await S77.nextFrame(); const s = performance.now(); fn.call(this); this.timings[msg] = Math.round(performance.now() - s); };
      this.timings = {};
      const N = this.N;
      this.ter = new Uint8Array(N); this.prov = new Uint8Array(N); this.obj = new Uint8Array(N);
      this.bld = new Uint16Array(N); this.elev = new Uint8Array(N); this.zone = new Uint16Array(N);
      this.road = new Uint8Array(N); this.flag = new Uint8Array(N);
      this.land = new Uint8Array(N); // 0 sea, 1 thai, 2 foreign
      this.isle = new Uint8Array(N); // island province override (idx+1)

      await step('วาดเส้นขอบประเทศ', 0.05, this.genMask);
      await step('สร้างแม่น้ำและทะเลสาบ', 0.15, this.genWater);
      await step('คำนวณชายฝั่ง', 0.22, this.genCoast);
      await step('ยกเทือกเขา', 0.3, this.genElevation);
      await step('วางผังตัวเมือง 77 จังหวัด', 0.38, this.placeTowns);
      await step('แบ่งเขตจังหวัด', 0.45, this.genProvinces);
      await step('ปลูกป่าและทุ่งนา', 0.55, this.genBiomes);
      await step('สร้างถนนในเมือง', 0.62, this.stampTowns);
      await step('ตัดทางหลวงเชื่อมจังหวัด', 0.7, this.genHighways);
      await step('สร้างอาคาร', 0.78, this.buildTowns);
      await step('ตั้งหมู่บ้าน', 0.86, this.genVillages);
      await step('ตกแต่งธรรมชาติ', 0.93, this.genDecor);
      await step('จัดทำดัชนี', 0.98, this.indexBuildings);
      this.genTime = Math.round(performance.now() - t0);
      return this;
    }

    // scanline polygon fill (poly in tile coords)
    fillPoly(poly, cb) {
      const W = this.W, H = this.H, n = poly.length;
      let ymin = Infinity, ymax = -Infinity;
      for (const p of poly) { if (p[1] < ymin) ymin = p[1]; if (p[1] > ymax) ymax = p[1]; }
      ymin = Math.max(0, Math.floor(ymin)); ymax = Math.min(H - 1, Math.ceil(ymax));
      const xs = [];
      for (let y = ymin; y <= ymax; y++) {
        const yc = y + 0.5; xs.length = 0;
        for (let i = 0, j = n - 1; i < n; j = i++) {
          const yi = poly[i][1], yj = poly[j][1];
          if (yi > yc !== yj > yc) xs.push(poly[i][0] + ((yc - yi) * (poly[j][0] - poly[i][0])) / (yj - yi));
        }
        xs.sort((a, b) => a - b);
        for (let k = 0; k + 1 < xs.length; k += 2) {
          const x0 = Math.max(0, Math.ceil(xs[k] - 0.5)), x1 = Math.min(W - 1, Math.floor(xs[k + 1] - 0.5));
          for (let x = x0; x <= x1; x++) cb(y * W + x, x, y);
        }
      }
    }

    genMask() {
      const land = this.land; land.fill(2);
      // jitter the outline slightly so coasts aren't straight lines
      const jitter = (poly, amp, s) => U.spline(poly.map((p) => this.toTile(p)), 3).map((p) => [p[0] + (U.fbm(p[0] / 18, p[1] / 18, s, 2) - 0.5) * amp, p[1] + (U.fbm(p[0] / 18, p[1] / 18, s + 9, 2) - 0.5) * amp]);
      for (const sea of GEO.SEAS) this.fillPoly(sea.map((p) => this.toTile(p)), (i) => (land[i] = 0));
      this.fillPoly(jitter(GEO.OUTLINE, 7, 3), (i) => (land[i] = 1));
      for (const isl of GEO.ISLANDS) {
        const pi = S77.PROV_BY_KEY[isl.prov].idx + 1;
        this.fillPoly(jitter(isl.poly, 3, 5), (i) => { land[i] = 1; this.isle[i] = pi; });
      }
      // karst islets in Phang Nga bay / Krabi: tiny islands
      const r = U.rng(this.seed * 3 + 1);
      for (const k of GEO.KARST) {
        const pts = U.spline(k.pts.map((p) => this.toTile(p)), 6);
        for (const p of pts) {
          if (r() < 0.55) continue;
          const ox = p[0] + (r() - 0.5) * k.w * 120 * 2, oy = p[1] + (r() - 0.5) * k.w * 120 * 1.2;
          const xi = ox | 0, yi = oy | 0;
          if (this.inb(xi, yi) && land[this.id(xi, yi)] === 0) {
            const rr = 1 + r() * 2.2;
            for (let y = Math.floor(oy - rr); y <= oy + rr; y++) for (let x = Math.floor(ox - rr); x <= ox + rr; x++)
              if (this.inb(x, y) && Math.hypot(x - ox, y - oy) <= rr && land[this.id(x, y)] === 0) { land[this.id(x, y)] = 1; this.isle[this.id(x, y)] = 255; }
          }
        }
      }
      const ter = this.ter;
      for (let i = 0; i < this.N; i++) ter[i] = land[i] === 0 ? T.SEA : land[i] === 2 ? T.FOREIGN : T.GRASS;
    }

    genWater() {
      const ter = this.ter, land = this.land;
      // lakes
      for (const L of GEO.LAKES) {
        const [cx, cy] = this.toTile([L[0], L[1]]), rx = L[2] * this.TPD_X, ry = L[3] * this.TPD_Y;
        for (let y = Math.floor(cy - ry - 3); y <= cy + ry + 3; y++) for (let x = Math.floor(cx - rx - 3); x <= cx + rx + 3; x++) {
          if (!this.inb(x, y)) continue;
          const n = U.fbm(x / 6, y / 6, 51, 2) * 0.35;
          const d = Math.hypot((x + 0.5 - cx) / rx, (y + 0.5 - cy) / ry);
          const i = this.id(x, y);
          if (d < 0.85 + n && land[i] === 1) ter[i] = T.LAKE;
        }
      }
      // rivers
      this.riverPaths = [];
      for (const R of GEO.RIVERS) {
        const pts = U.spline(R.pts.map((p) => this.toTile(p)), 10);
        // resample to ~0.5 tile steps with meander noise
        const out = [];
        for (let k = 0; k < pts.length - 1; k++) {
          const a = pts[k], b = pts[k + 1], len = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(len * 2));
          for (let s = 0; s < n; s++) {
            const t = s / n, x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t;
            const nx = -(b[1] - a[1]) / (len || 1), ny = (b[0] - a[0]) / (len || 1);
            const m = (U.fbm(x / 22, y / 22, 61, 3) - 0.5) * (R.border ? 3 : 7);
            out.push([x + nx * m, y + ny * m]);
          }
        }
        this.riverPaths.push({ name: R.name, w: R.w, pts: out });
        const r = R.w / 2;
        for (const p of out) {
          for (let y = Math.floor(p[1] - r - 1); y <= p[1] + r + 1; y++) for (let x = Math.floor(p[0] - r - 1); x <= p[0] + r + 1; x++) {
            if (!this.inb(x, y)) continue;
            if (Math.hypot(x + 0.5 - p[0], y + 0.5 - p[1]) > r + 0.15) continue;
            const i = this.id(x, y);
            if (land[i] === 0) continue;
            if (land[i] === 2 && !R.border) continue;
            ter[i] = T.RIVER;
          }
        }
      }
    }

    genCoast() {
      const W = this.W, H = this.H, N = this.N, land = this.land, ter = this.ter;
      // distance (in tiles) from sea into land, and from land into sea
      const bfs = (isSource, canEnter, cap) => {
        const d = new Uint8Array(N).fill(255), q = new Int32Array(N); let h = 0, t = 0;
        for (let i = 0; i < N; i++) if (isSource(i)) { d[i] = 0; q[t++] = i; }
        while (h < t) {
          const i = q[h++], dv = d[i]; if (dv >= cap) continue;
          const x = i % W, y = (i / W) | 0;
          if (x > 0 && d[i - 1] === 255 && canEnter(i - 1)) { d[i - 1] = dv + 1; q[t++] = i - 1; }
          if (x < W - 1 && d[i + 1] === 255 && canEnter(i + 1)) { d[i + 1] = dv + 1; q[t++] = i + 1; }
          if (y > 0 && d[i - W] === 255 && canEnter(i - W)) { d[i - W] = dv + 1; q[t++] = i - W; }
          if (y < H - 1 && d[i + W] === 255 && canEnter(i + W)) { d[i + W] = dv + 1; q[t++] = i + W; }
        }
        return d;
      };
      this.coastDist = bfs((i) => land[i] === 0, (i) => land[i] === 1, 40);
      const seaDist = bfs((i) => land[i] !== 0, (i) => land[i] === 0, 6);
      for (let i = 0; i < N; i++) if (land[i] === 0) ter[i] = seaDist[i] <= 4 ? T.SEA : T.DEEP;
      this.riverDist = bfs((i) => ter[i] === T.RIVER || ter[i] === T.LAKE, (i) => land[i] === 1, 30);
    }

    genElevation() {
      const W = this.W, H = this.H, F = 4, CWc = Math.ceil(W / F) + 1, CHc = Math.ceil(H / F) + 1;
      const ridge = new Float32Array(CWc * CHc);
      for (const R of GEO.RIDGES) {
        const pts = U.spline(R.pts.map((p) => this.toTile(p)), 4), wt = R.w * this.TPD_Y;
        for (let k = 0; k < pts.length - 1; k++) {
          const a = pts[k], b = pts[k + 1], m = wt * 2.6;
          const x0 = Math.max(0, Math.floor((Math.min(a[0], b[0]) - m) / F)), x1 = Math.min(CWc - 1, Math.ceil((Math.max(a[0], b[0]) + m) / F));
          const y0 = Math.max(0, Math.floor((Math.min(a[1], b[1]) - m) / F)), y1 = Math.min(CHc - 1, Math.ceil((Math.max(a[1], b[1]) + m) / F));
          for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
            const d = U.segDist(cx * F, cy * F, a[0], a[1], b[0], b[1]) / wt;
            const v = R.s * Math.exp(-d * d);
            const ci = cy * CWc + cx; if (v > ridge[ci]) ridge[ci] = v;
          }
        }
      }
      const elev = this.elev, land = this.land, ter = this.ter;
      const nA = U.noiseGrid(W, H, 4, 34, 21, 3), nB = U.noiseGrid(W, H, 2, 11, 22, 2), nC = U.noiseGrid(W, H, 4, 46, 23, 2);
      for (let y = 0; y < H; y++) {
        const fy = y / F, cy = Math.floor(fy), ty = fy - cy;
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          if (land[i] !== 1) { elev[i] = 0; continue; }
          const fx = x / F, cx = Math.floor(fx), tx = fx - cx, c = cy * CWc + cx;
          const r = (ridge[c] * (1 - tx) + ridge[c + 1] * tx) * (1 - ty) + (ridge[c + CWc] * (1 - tx) + ridge[c + CWc + 1] * tx) * ty;
          let e = r * (0.38 + 0.9 * nA(x, y));
          e += (nB(x, y) - 0.5) * 0.14 * (0.3 + r);
          e += Math.max(0, nC(x, y) - 0.66) * 1.1; // scattered lone hills
          if (this.coastDist[i] < 3) e *= 0.4;
          elev[i] = U.clamp(Math.round(e * 200), 0, 255);
          if (WATER[ter[i]]) elev[i] = 0;
        }
      }
    }

    /* ---------- towns: centre + radius, pushed apart so central provinces all fit ---------- */
    placeTowns() {
      const RAD = { 1: 26, 2: 15, 3: 12, 4: 10 };
      const land = this.land, ter = this.ter, elev = this.elev;
      const good = (x, y) => { if (!this.inb(x, y)) return false; const i = this.id(x, y); return land[i] === 1 && !WATER[ter[i]] && elev[i] < 80 && !this.isle[i]; };
      const goodIsle = (x, y, pi) => { if (!this.inb(x, y)) return false; const i = this.id(x, y); return land[i] === 1 && !WATER[ter[i]] && elev[i] < 80 && this.isle[i] === pi; };
      const order = S77.PROVINCES.slice().sort((a, b) => a.tier - b.tier || b.pop - a.pop);
      const placed = [];
      for (const p of order) {
        let R = RAD[p.tier];
        let [px, py] = this.toTile([p.lon, p.lat]);
        const islandPI = GEO.ISLANDS.some((I) => I.prov === p.key && U.pointInPoly(p.lon, p.lat, I.poly)) ? p.idx + 1 : 0;
        const ok = islandPI ? (x, y) => goodIsle(x, y, islandPI) : good;
        // push away from already placed bigger towns
        for (let it = 0; it < 6; it++) {
          for (const q of placed) {
            const need = (R + q.R) * 0.92, d = Math.hypot(px - q.cx, py - q.cy);
            if (d < need) {
              const dx = (px - q.cx) / (d || 1), dy = (py - q.cy) / (d || 1);
              px = q.cx + dx * need; py = q.cy + dy * need;
            }
          }
        }
        // choose best nearby centre (lots of usable land, close to target)
        let best = null, bestS = -1e9;
        const sr = 12;
        for (let oy = -sr; oy <= sr; oy += 2) for (let ox = -sr; ox <= sr; ox += 2) {
          const cx = Math.round(px + ox), cy = Math.round(py + oy);
          if (!ok(cx, cy)) continue;
          let cnt = 0, tot = 0;
          for (let sy = -R; sy <= R; sy += 3) for (let sx = -R; sx <= R; sx += 3) {
            if (sx * sx + sy * sy > R * R) continue; tot++;
            if (ok(cx + sx, cy + sy)) cnt++;
          }
          let clash = 0;
          for (const q of placed) { const d = Math.hypot(cx - q.cx, cy - q.cy); if (d < (R + q.R) * 0.85) clash += (R + q.R) * 0.85 - d; }
          const s = (cnt / (tot || 1)) * 100 - Math.hypot(ox, oy) * 1.2 - clash * 6;
          if (s > bestS) { bestS = s; best = [cx, cy]; }
        }
        if (!best) {
          // fall back to the nearest usable tile in a wider ring
          outer: for (let r = 1; r < 40; r++) for (let oy = -r; oy <= r; oy++) for (let ox = -r; ox <= r; ox++) {
            if (Math.max(Math.abs(ox), Math.abs(oy)) !== r) continue;
            if (ok(Math.round(px + ox), Math.round(py + oy))) { best = [Math.round(px + ox), Math.round(py + oy)]; break outer; }
          }
        }
        if (!best) best = [Math.round(px), Math.round(py)];
        const town = { idx: p.idx, prov: p, cx: best[0], cy: best[1], R, S: p.tier === 1 ? 9 : 7, buildings: [], blocks: [], island: islandPI };
        placed.push(town);
      }
      this.towns = [];
      for (const t of placed) this.towns[t.idx] = t;
    }

    genProvinces() {
      const W = this.W, H = this.H, prov = this.prov, land = this.land, isle = this.isle;
      // seeds: town centres + extra shaping seeds
      const seeds = [];
      for (const t of this.towns) {
        seeds.push({ x: t.cx, y: t.cy, p: t.idx, isl: t.island });
        for (const s of t.prov.seeds) { const [x, y] = this.toTile(s); seeds.push({ x, y, p: t.idx, isl: 0 }); }
      }
      const main = seeds.filter((s) => !s.isl);
      // candidate lists per 32x32 cell to keep it fast
      const C = 32, cw = Math.ceil(W / C), ch = Math.ceil(H / C), cand = new Array(cw * ch);
      const warp = 26;
      for (let cy = 0; cy < ch; cy++) for (let cx = 0; cx < cw; cx++) {
        const mx = cx * C + C / 2, my = cy * C + C / 2;
        let d0 = Infinity; for (const s of main) d0 = Math.min(d0, Math.hypot(s.x - mx, s.y - my));
        const lim = d0 + C * 1.42 + warp * 1.5;
        cand[cy * cw + cx] = main.filter((s) => Math.hypot(s.x - mx, s.y - my) <= lim);
      }
      const wA = U.noiseGrid(W, H, 4, 60, 31, 2), wB = U.noiseGrid(W, H, 4, 60, 32, 2);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (land[i] !== 1) continue;
        if (isle[i] && isle[i] !== 255) { prov[i] = isle[i]; continue; }
        const wx = x + (wA(x, y) - 0.5) * warp * 2, wy = y + (wB(x, y) - 0.5) * warp * 2;
        const list = cand[((y / C) | 0) * cw + ((x / C) | 0)];
        let bd = Infinity, bp = 0;
        for (let k = 0; k < list.length; k++) { const s = list[k], dx = s.x - wx, dy = s.y - wy, d = dx * dx + dy * dy; if (d < bd) { bd = d; bp = s.p; } }
        prov[i] = bp + 1;
      }
      // small karst islets (isle=255) → nearest mainland province (from neighbours)
      for (let i = 0; i < this.N; i++) if (isle[i] === 255) {
        const x = i % W, y = (i / W) | 0; let best = 0, bd = 1e9;
        for (const t of this.towns) { const d = Math.hypot(t.cx - x, t.cy - y); if (d < bd) { bd = d; best = t.idx + 1; } }
        prov[i] = best;
      }
      // province areas (tiles) & bounding boxes for the map UI
      this.provArea = new Int32Array(77); this.provBox = S77.PROVINCES.map(() => [1e9, 1e9, -1, -1]);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const p = prov[y * W + x]; if (!p) continue;
        this.provArea[p - 1]++; const b = this.provBox[p - 1];
        if (x < b[0]) b[0] = x; if (y < b[1]) b[1] = y; if (x > b[2]) b[2] = x; if (y > b[3]) b[3] = y;
      }
    }

    genBiomes() {
      const W = this.W, H = this.H, ter = this.ter, land = this.land, elev = this.elev, prov = this.prov, cd = this.coastDist, rd = this.riverDist;
      const P = S77.PROVINCES;
      // mangrove coast zones
      const mangrove = (x, y) => {
        const lon = this.xToLon(x), lat = this.yToLat(y);
        if (lat > 13.3 && lat < 13.65 && lon > 99.9 && lon < 101.0) return true; // gulf head
        if (lon < 99.9 && lat < 10.2 && lat > 6.5) return U.fbm(x / 12, y / 12, 71, 2) > 0.52; // andaman coast
        if (lon > 101.9 && lon < 102.6 && lat < 12.7 && lat > 12.1) return U.fbm(x / 10, y / 10, 72, 2) > 0.55; // chanthaburi/trat
        return false;
      };
      const g1 = U.noiseGrid(W, H, 3, 26, 81, 3), g2 = U.noiseGrid(W, H, 2, 8, 82, 2);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (land[i] !== 1 || WATER[ter[i]]) continue;
        const e = elev[i];
        const p = prov[i] ? P[prov[i] - 1] : null, reg = p ? p.region : 'central';
        const n1 = g1(x, y), n2 = g2(x, y);
        let t;
        if (e > 132) t = T.MOUNTAIN;
        else if (e > 92) t = reg === 'south' || (reg === 'east' && n1 > 0.4) ? T.JUNGLE : T.HILL;
        else if (cd[i] <= 1) t = mangrove(x, y) ? T.MANGROVE : T.SAND;
        else if (cd[i] <= 3 && n2 > 0.58 && !mangrove(x, y)) t = T.SAND;
        else {
          const wet = rd[i] < 14;
          switch (reg) {
            case 'central':
              t = n1 < (wet ? 0.68 : 0.56) ? T.PADDY : n1 < 0.7 ? T.FIELD : n2 > 0.55 ? T.ORCHARD : T.GRASS;
              if (e > 60 && n2 > 0.4) t = T.FOREST;
              break;
            case 'north':
              t = wet && n1 < 0.6 ? T.PADDY : e > 55 ? (n2 > 0.35 ? T.FOREST : T.GRASS) : n1 < 0.42 ? T.PADDY : n1 < 0.58 ? T.FIELD : n2 > 0.5 ? T.FOREST : T.GRASS;
              break;
            case 'northeast':
              t = n1 < (wet ? 0.62 : 0.5) ? T.PADDY : n1 < 0.66 ? T.FIELD : n2 > 0.62 ? T.FOREST : T.DRYGRASS;
              break;
            case 'east':
              t = wet && n1 < 0.42 ? T.PADDY : n1 < 0.5 ? T.ORCHARD : n1 < 0.62 ? T.PLANT : n2 > 0.55 ? T.FOREST : T.FIELD;
              break;
            case 'west':
              t = wet && n1 < 0.5 ? T.PADDY : n1 < 0.5 ? T.FIELD : n2 > 0.45 ? T.FOREST : T.GRASS;
              if (e > 55) t = T.FOREST;
              break;
            default: // south
              t = wet && n1 < 0.34 ? T.PADDY : n1 < 0.62 ? T.PLANT : n2 > 0.48 ? T.JUNGLE : T.ORCHARD;
          }
        }
        ter[i] = t;
      }
    }

    /* ---------- stamp towns: zone, streets, plaza ---------- */
    stampTowns() {
      const W = this.W, ter = this.ter, zone = this.zone, prov = this.prov, land = this.land, elev = this.elev;
      const mod = (a, n) => ((a % n) + n) % n;
      for (const t of this.towns) {
        const { cx, cy, R, S } = t, z = t.idx + 1;
        t.tiles = 0;
        const Rx = R + 4;
        for (let y = cy - Rx; y <= cy + Rx; y++) for (let x = cx - Rx; x <= cx + Rx; x++) {
          if (!this.inb(x, y)) continue;
          const i = this.id(x, y);
          if (land[i] !== 1 || zone[i]) continue;
          if (t.island && this.isle[i] !== t.island) continue;
          const d = Math.hypot(x - cx, y - cy), rr = R * (0.84 + 0.32 * U.fbm(x / 7, y / 7, 41 + t.idx, 2));
          if (d > rr) continue;
          zone[i] = z; prov[i] = z;
          if (WATER[ter[i]]) continue;
          t.tiles++;
          if (elev[i] > 80) elev[i] = 40 + (elev[i] & 15);
          const dx = x - cx, dy = y - cy;
          const street = mod(dx, S) === 0 || mod(dy, S) === 0;
          ter[i] = street ? T.STREET : d < rr * 0.62 ? T.PAVE : T.YARD;
        }
        // main avenues reach outward to meet highways
        const ext = Math.round(R * 1.45);
        for (let k = -ext; k <= ext; k++) {
          for (const [x, y] of [[cx + k, cy], [cx, cy + k]]) {
            if (!this.inb(x, y)) continue;
            const i = this.id(x, y);
            if (land[i] !== 1 || (zone[i] && zone[i] !== z) || WATER[ter[i]] || ter[i] === T.MOUNTAIN) continue;

/* render.js — isometric renderer.

      const w = this.world, b = this.bctx, bw = this.buf.width, bh = this.buf.height;
      const cam = game.camera;
      this.offX = Math.floor(bw / 2) - Math.round((cam.x - cam.y) * 16);
      this.offY = Math.floor(bh / 2) - Math.round((cam.x + cam.y) * 8);
      const offX = this.offX, offY = this.offY;
      const night = game.time.isNight();
      b.globalCompositeOperation = 'source-over';
      b.fillStyle = '#1d6aa8'; b.fillRect(0, 0, bw, bh);
      // visible tile bounds
      const corners = [[0, -40], [bw, -40], [0, bh + 140], [bw, bh + 140]].map(([sx, sy]) => this.fromScreen(sx * this.zoom, sy * this.zoom));
      let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
      for (const [x, y] of corners) { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); }
      minx = Math.max(0, Math.floor(minx) - 2); miny = Math.max(0, Math.floor(miny) - 2); maxx = Math.min(w.W - 1, Math.ceil(maxx) + 2); maxy = Math.min(w.H - 1, Math.ceil(maxy) + 2);
      // ground
      const cl = [];
      for (let cy = Math.floor(miny / CH); cy <= Math.floor(maxy / CH); cy++) for (let cx = Math.floor(minx / CH); cx <= Math.floor(maxx / CH); cx++) {
        const X0 = (cx * CH - cy * CH) * 16 + offX - C_OX, Y0 = (cx * CH + cy * CH) * 8 + offY;
        if (X0 > bw || X0 + CW_PX < 0 || Y0 > bh || Y0 + CH_PX < 0) continue;
        cl.push([cx, cy, X0, Y0]);
      }
      cl.sort((p, q) => p[0] + p[1] - q[0] - q[1]);
      let built = 0;
      for (const [cx, cy, X0, Y0] of cl) {
        const k = cx + ',' + cy;
        if (!this.chunks.has(k) && built > 3 && this.frame > 2) continue; // spread chunk building over frames
        if (!this.chunks.has(k)) built++;
        b.drawImage(this.chunk(cx, cy), X0, Y0);
      }
      // water sparkle + collect objects
      const items = [];
      const lights = (this.lights = []);
      const tsec = game.time.realSec;
      const ter = w.ter, obj = w.obj, W = w.W;
      for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) {
        const X = (x - y) * 16 + offX, Y = (x + y) * 8 + offY;
        if (X < -48 || X > bw + 48 || Y < -60 || Y > bh + 130) continue;
        const i = y * W + x, o = obj[i], t = ter[i];
        if (S77.isWater(t) && Y < bh + 8 && U.hash2(x, y, (tsec * 1.5) | 0) < 0.05) {
          const sx = X - 8 + ((U.hash2(x, y, 5) * 16) | 0), sy = Y + 8 + ((U.hash2(x, y, 6) * 6) | 0);

        }
        if (!o) continue;
        const spr = SP.object(o, U.hash2(x, y, 13) * 4 | 0, night, w.elev[i]);
        if (!spr) continue;
        const wy = S77.isWater(t) ? 4 : 0;
        const dx = o >= O.LAMP || o === O.KARST || o === O.PEAK ? X - spr.ax : X - spr.ax;
        items.push({ d: x + y + 1, img: spr, x: dx, y: Y - spr.ay + wy + (o === O.PEAK || o === O.KARST ? 0 : 0) });
        if (night && o === O.LAMP) lights.push([X + 3, Y + 8 - 24, 34, 'rgba(255,214,140,0.9)']);
      }
      // buildings as depth strips
      const seen = this.seenStamp = (this.seenStamp || 0) + 1;
      for (let cy = Math.floor(miny / CH) - 1; cy <= Math.floor(maxy / CH) + 1; cy++) for (let cx = Math.floor(minx / CH) - 1; cx <= Math.floor(maxx / CH) + 1; cx++) {
        const list = w.buildingsNearChunk(cx, cy);
        if (!list) continue;
        for (const bd of list) {
          if (bd._seen === seen) continue; bd._seen = seen;
          const X = (bd.x - bd.y) * 16 + offX, Y = (bd.x + bd.y) * 8 + offY;
          const spr = SP.building(bd, night);
          const sx = X - spr.ax, sy = Y - spr.ay;
          if (sx > bw || sx + spr.width < 0 || sy > bh || sy + spr.height < 0) continue;
          const n = bd.fw + bd.fd;
          for (let j = 0; j < n; j++) {
            const x0 = j === 0 ? 0 : 2 + 16 * j, x1 = j === n - 1 ? spr.width : 2 + 16 * (j + 1);
            const d = j < bd.fw ? bd.x + j + bd.y + bd.fd - 1 + 1 : bd.x + bd.fw - 1 + bd.y + bd.fd - 1 - (j - bd.fw) + 1;
            items.push({ d: d - 0.01, img: spr, sx: x0, sw: x1 - x0, x: sx + x0, y: sy });
          }
          if (night) {
            const big = bd.type === 'tower' || bd.type === 'condo' || bd.type === 'mall' || bd.type === 'lodge' || bd.type === 'hospital';
            lights.push([X + (bd.fw - bd.fd) * 8, Y + (bd.fw + bd.fd) * 4 - 6, big ? 56 : 30, 'rgba(255,200,120,0.75)']);
            if (bd.lm === 'lighthouse') lights.push([X, Y - 40, 90, 'rgba(255,240,180,0.9)']);
          }
        }
      }
      // entities (npcs, animals, player, remote vehicles)
      for (const e of game.visibleEntities()) {
        const [X, Y] = [(e.x - e.y) * 16 + offX, (e.x + e.y) * 8 + offY];
        if (X < -40 || X > bw + 40 || Y < -40 || Y > bh + 40) continue;
        items.push({ d: e.x + e.y, ent: e, X, Y });
        if (night && e.isPlayer) lights.push([X, Y - 10, 46, 'rgba(255,230,180,0.65)']);
      }
      items.sort((p, q) => p.d - q.d);
      for (const it of items) {
        if (it.ent) this.drawEntity(b, it.ent, it.X, it.Y, game);
        else if (it.sw) b.drawImage(it.img, it.sx, 0, it.sw, it.img.height, it.x, it.y, it.sw, it.img.height);
        else b.drawImage(it.img, it.x, it.y);
      }
      // interaction target highlight
      if (game.target && game.target.hl) {
        const [hx, hy] = this.toBuf(game.target.hl[0] + 0.5, game.target.hl[1] + 0.5);
        b.strokeStyle = 'rgba(255,240,120,' + (0.55 + 0.35 * Math.sin(tsec * 6)) + ')';
        b.beginPath(); b.moveTo(hx, hy - 8); b.lineTo(hx + 16, hy); b.lineTo(hx, hy + 8); b.lineTo(hx - 16, hy); b.closePath(); b.stroke();
      }
      this.drawAtmosphere(game, dt);
      // blit
      const ctx = this.ctx;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(this.buf, 0, 0, bw * this.zoom, bh * this.zoom);
    }

    drawEntity(b, e, X, Y, game) {
      // shadow
      b.fillStyle = 'rgba(0,0,0,0.22)';
      b.beginPath(); b.ellipse(X, Y, e.shadow || 6, (e.shadow || 6) / 2.2, 0, 0, 6.283); b.fill();
      if (e.kind === 'animal') {
        const spr = SP.animal(e.species, e.color);
        const f = (e.moving ? (Math.floor(game.time.realSec * 6) % 2) : 0) + (e.faceLeft ? 4 : 0);
        b.drawImage(spr, f * spr.fw, 0, spr.fw, spr.fh, Math.round(X - spr.fw / 2), Math.round(Y - spr.fh + 2), spr.fw, spr.fh);

      }
      const spr = SP.character(e.look);
      const back = e.faceBack ? 1 : 0, mir = e.faceLeft ? 1 : 0;
      let f = 0;
      if (e.moving && !e.riding) f = Math.floor(e.anim * 8) % 4;
      const riseY = e.riding ? -3 : 0;
      if (e.riding) {
        const v = SP.vehicle(e.riding, back, mir);
        b.drawImage(v, Math.round(X - 14), Math.round(Y - 14));
      }
      b.drawImage(spr, (back * 4 + f) * spr.fw, mir * spr.fh, spr.fw, spr.fh, Math.round(X - spr.fw / 2), Math.round(Y - spr.fh + 1 + riseY), spr.fw, spr.fh);
      if (e.umbrella && game.weather.rain > 0.2) {
        b.fillStyle = '#d23a3a'; b.fillRect(Math.round(X - 9), Math.round(Y - 33), 18, 3); b.fillRect(Math.round(X - 6), Math.round(Y - 35), 12, 2); b.fillStyle = '#555'; b.fillRect(Math.round(X), Math.round(Y - 31), 1, 10);
      }
    }

    drawAtmosphere(game, dt) {
      const b = this.bctx, bw = this.buf.width, bh = this.buf.height;
      const L = game.time.lighting();
      const wx = game.weather;
      // haze / mist
      if (wx.haze > 0) { b.fillStyle = `rgba(196,176,140,${0.28 * wx.haze})`; b.fillRect(0, 0, bw, bh); }
      if (wx.mist > 0) { b.fillStyle = `rgba(235,240,245,${0.22 * wx.mist})`; b.fillRect(0, 0, bw, bh); }
      if (wx.rain > 0) { b.fillStyle = `rgba(40,55,80,${0.18 * wx.rain})`; b.fillRect(0, 0, bw, bh); }
      // lighting
      if (L.dark > 0.01 || L.tint) {
        const l = this.lctx;
        l.globalCompositeOperation = 'source-over';
        l.fillStyle = `rgb(${L.r},${L.g},${L.b})`; l.fillRect(0, 0, bw, bh);
        if (L.dark > 0.25) {
          l.globalCompositeOperation = 'lighter';
          for (const [x, y, r, c] of this.lights) { if (x < -r || y < -r || x > bw + r || y > bh + r) continue; l.drawImage(SP.light(r, c), x - r, y - r); }
        }
        b.globalCompositeOperation = 'multiply';
        b.drawImage(this.lcv, 0, 0);
        b.globalCompositeOperation = 'source-over';
      }
      // rain drops
      if (wx.rain > 0) {
        const n = Math.floor(160 * wx.rain), t = performance.now() / 1000;
        b.fillStyle = 'rgba(200,220,255,0.55)';
        for (let k = 0; k < n; k++) {
          const sx = (U.hash2(k, 1, 3) * bw + t * 120) % bw, sy = (U.hash2(k, 2, 3) * bh + t * 420 + k * 7) % bh;
          b.fillRect(sx | 0, sy | 0, 1, 4);
        }
      }
    }

    /* ---------- overview map (1px per tile) ---------- */
    buildMapCanvas() {
      const w = this.world, cv = document.createElement('canvas');
      cv.width = w.W; cv.height = w.H;
      const g = cv.getContext('2d'), img = g.createImageData(w.W, w.H), d = new Uint32Array(img.data.buffer);
      const col = {};
      const set = (t, h) => (col[t] = S77.PixelBuffer.pack(h));
      set(T.DEEP, '#1f5f9a'); set(T.SEA, '#2f86bd'); set(T.RIVER, '#4aa3c8'); set(T.LAKE, '#4aa3c8'); set(T.SAND, '#e6d39a'); set(T.GRASS, '#79b453');
      set(T.PADDY, '#9ccc5a'); set(T.FIELD, '#b7b46a'); set(T.FOREST, '#4a8a44'); set(T.JUNGLE, '#3a7a46'); set(T.HILL, '#6a9e52'); set(T.MOUNTAIN, '#8c8a76');
      set(T.PLANT, '#4f8a42'); set(T.ORCHARD, '#6faa4f'); set(T.ROAD, '#e6c24a'); set(T.STREET, '#8a8a90'); set(T.PAVE, '#c9c1b0'); set(T.PLAZA, '#d58a5a');
      set(T.DIRT, '#b58f60'); set(T.MANGROVE, '#55806a'); set(T.FOREIGN, '#9aa391'); set(T.BRIDGE, '#e6c24a'); set(T.YARD, '#8cc46a'); set(T.RUNWAY, '#555'); set(T.DRYGRASS, '#b9b468');
      const border = S77.PixelBuffer.pack('#2b2a33'), bld = S77.PixelBuffer.pack('#c0533f');
      const W = w.W;
      for (let i = 0; i < w.N; i++) {
        let c = col[w.ter[i]];
        if (w.bld[i]) c = bld;
        const p = w.prov[i];
        if (p && ((i % W > 0 && w.prov[i - 1] && w.prov[i - 1] !== p) || (i >= W && w.prov[i - W] && w.prov[i - W] !== p))) c = border;
        d[i] = c;
      }
      g.putImageData(img, 0, 0);
      this.mapCanvas = cv;
      return cv;
    }
  }
  S77.Renderer = Renderer;
})();


/* ===== js/systems.js ===== */
/* systems.js — simulation systems. Each system is registered in
   S77.SYSTEMS with optional hooks: init(game) update(dt) onHour(h) onDay(d)
   save() load(data). Phase 2 (politics) plugs in by registering more systems
   and listening to S77.Events — nothing here needs to be rewritten. */
'use strict';
(function () {
  const U = S77.U, T = S77.T, O = S77.O, E = S77.Events;
  const SYSTEMS = (S77.SYSTEMS = []);
  S77.registerSystem = (sys) => { SYSTEMS.push(sys); return sys; };

  /* ======================= time & calendar ======================= */
  const TH_MONTH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const TH_MONTH_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  const TH_DAY = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
  const FESTIVALS = { '11-24': 'เทศกาลลอยกระทง', '12-31': 'วันสิ้นปี', '1-1': 'วันขึ้นปีใหม่', '4-13': 'สงกรานต์', '4-14': 'สงกรานต์', '4-15': 'สงกรานต์', '2-14': 'วันวาเลนไทน์' };
  class GameTime {
    constructor() { this.total = 7 * 60; this.realSec = 0; this.rate = 1; this.paused = false; this.base = new Date(2026, 10, 1); }
    get day() { return Math.floor(this.total / 1440); }
    get minuteOfDay() { return this.total - this.day * 1440; }
    get hour() { return this.minuteOfDay / 60; }
    date() { const d = new Date(this.base); d.setDate(d.getDate() + this.day); return d; }
    month() { return this.date().getMonth() + 1; }
    isNight() { const h = this.hour; return h < 5.6 || h >= 18.9; }
    clock() { const m = Math.floor(this.minuteOfDay); return U.pad2(Math.floor(m / 60)) + ':' + U.pad2(m % 60); }
    dateStr(full) { const d = this.date(); return (full ? '' : TH_DAY[d.getDay()] + ' ') + d.getDate() + ' ' + (full ? TH_MONTH_FULL : TH_MONTH)[d.getMonth()] + ' ' + (d.getFullYear() + 543); }
    season() { const m = this.month(); return m >= 3 && m <= 5 ? 'hot' : m >= 6 && m <= 10 ? 'rainy' : 'cool'; }
    seasonTh() { return { hot: 'ฤดูร้อน', rainy: 'ฤดูฝน', cool: 'ฤดูหนาว' }[this.season()]; }
    festival() { const d = this.date(); return FESTIVALS[d.getMonth() + 1 + '-' + d.getDate()] || null; }
    lighting() {
      const h = this.hour;
      const night = [62, 74, 138], dawn = [255, 196, 160], day = [255, 255, 255], eve = [255, 210, 168], dusk = [168, 120, 170];
      const lerp3 = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));

      else if (h < 6.8) { const t = h - 5.8; c = lerp3(dawn, day, t); dark = 0.3 - t * 0.3; }
      else if (h < 16.5) { c = day; dark = 0; }

      else if (h < 19) { c = lerp3(eve, dusk, h - 18); dark = (h - 18) * 0.4; }
      else { c = lerp3(dusk, night, h - 19); dark = 0.4 + (h - 19) * 0.6; }
      return { r: c[0], g: c[1], b: c[2], dark, tint: c[0] < 255 || c[1] < 255 || c[2] < 255 };
    }
  }
  S77.GameTime = GameTime;

  /* ======================= weather ======================= */
  S77.registerSystem({
    id: 'weather',
    init(g) { g.weather = { rain: 0, rainTarget: 0, rainLeft: 0, haze: 0, mist: 0 }; },
    update(dt, g) {
      const w = g.weather;
      w.rain += (w.rainTarget - w.rain) * Math.min(1, dt * 0.5);
      const p = g.currentProv, h = g.time.hour, m = g.time.month();
      let haze = 0;
      if (p && g.provState[p.idx].issues.some((i) => i.id === 'haze')) haze = p.region === 'north' ? 1 : 0.5;
      w.haze += (haze - w.haze) * Math.min(1, dt * 0.3);
      const mist = p && (p.region === 'north' || p.key === 'loei') && (m >= 11 || m <= 2) && h > 4.5 && h < 8.5 ? 1 - Math.abs(h - 6.5) / 2 : 0;
      w.mist += (mist - w.mist) * Math.min(1, dt * 0.3);
    },
    onHour(h, g) {
      const w = g.weather, s = g.time.season();
      if (w.rainLeft > 0) { w.rainLeft--; if (w.rainLeft <= 0) w.rainTarget = 0; return; }
      const chance = s === 'rainy' ? (h >= 13 && h <= 19 ? 0.22 : 0.08) : s === 'hot' ? (h >= 15 && h <= 18 ? 0.06 : 0.01) : 0.012;
      const south = g.currentProv && g.currentProv.region === 'south';
      if (Math.random() < chance * (south ? 1.5 : 1)) { w.rainTarget = 0.5 + Math.random() * 0.5; w.rainLeft = 1 + ((Math.random() * 3) | 0); }
    },
    save(g) { return { rainTarget: g.weather.rainTarget, rainLeft: g.weather.rainLeft }; },
    load(d, g) { Object.assign(g.weather, d || {}); g.weather.rain = g.weather.rainTarget; },
  });

  /* ======================= player needs ======================= */
  S77.registerSystem({
    id: 'needs',
    update(dt, g) {
      const pl = g.player, mins = g.minutesThisFrame;
      if (!mins) return;
      const s = pl.stats;
      const move = pl.moving ? (pl.running ? 2.2 : 1.3) : 1;
      s.hunger = U.clamp(s.hunger - mins * 0.1, 0, 100);
      s.energy = U.clamp(s.energy - mins * 0.075 * (pl.riding ? 0.8 : move), 0, 100);
      let moodTarget = 55 + (s.hunger > 60 ? 6 : 0) - (s.hunger < 20 ? 15 : 0) - (s.energy < 15 ? 12 : 0);
      if (g.weather.rain > 0.3 && !pl.inv.umbrella && !g.indoors) moodTarget -= 10;
      s.mood += (moodTarget - s.mood) * Math.min(1, mins * 0.004);
      if (s.hunger <= 0 || s.energy <= 0) s.health = U.clamp(s.health - mins * 0.05, 0, 100);
      else if (s.hunger > 40 && s.energy > 30) s.health = U.clamp(s.health + mins * 0.01, 0, 100);
      if (s.energy <= 0 && !g.fainting) g.faint('energy');
      else if (s.health <= 0 && !g.fainting) g.faint('health');
    },
  });

  /* ======================= province simulation (Phase-2 foundation) ======================= */
  // Each province carries economic/social state + issues; daily tick nudges them.
  function initProvinceState(p) {
    const rnd = U.rng(U.hashStr(p.key));
    const econ = { 1: 1.55, 2: 1.15, 3: 0.95, 4: 0.85 }[p.tier] + (p.econ.indexOf('I') >= 0 ? 0.12 : 0) + (p.econ.indexOf('T') >= 0 ? 0.08 : 0) + (p.econ.indexOf('O') >= 0 ? 0.1 : 0);
    const base = (v) => U.clamp(v + (rnd() - 0.5) * 16, 15, 90);
    const st = {
      key: p.key, econ: +econ.toFixed(2), happiness: base(58), development: base(35 + (5 - p.tier) * 10), environment: base(62 - (p.econ.indexOf('I') >= 0 ? 14 : 0)),
      safety: base(60), education: base(45 + (5 - p.tier) * 6), health: base(52 + (5 - p.tier) * 5), unemployment: +(2 + rnd() * 3 + (p.tier === 4 ? 1.5 : 0)).toFixed(1),
      issues: [], priceMul: 1, history: [], governor: null, seats: 0,
    };
    st.wageMul = +(0.75 + econ * 0.32).toFixed(2);
    // permanent-ish structural issues
    const add = (id, sev) => st.issues.push({ id, sev, days: 999 });
    if (p.tier === 1) add('traffic', 0.8), add('costliving', 0.6);
    if (p.tier === 2 && rnd() < 0.5) add('traffic', 0.4);
    if (p.econ.indexOf('A') >= 0 && rnd() < 0.55) add('cropprice', 0.4 + rnd() * 0.3);
    if (p.tier === 4 && rnd() < 0.6) add('jobs', 0.5);
    if (p.econ.indexOf('F') >= 0 && rnd() < 0.4) add('fishery', 0.4);
    if (p.econ.indexOf('B') >= 0 && rnd() < 0.4) add('border', 0.35);
    if (p.econ.indexOf('I') >= 0 && rnd() < 0.5) add('environment', 0.45);
    if (rnd() < 0.3) add(U.pick(['roads', 'health', 'education'], rnd()), 0.3 + rnd() * 0.3);

  }
  // seasonal issues by region/month
  function seasonalIssues(p, month) {
    const out = [];

    if (p.key === 'bangkok' && (month === 1 || month === 2)) out.push(['haze', 0.4]);
    if (p.region === 'northeast' && month >= 3 && month <= 5) out.push(['drought', 0.7]);
    if ((p.region === 'central' || p.region === 'northeast' || p.region === 'north') && month >= 8 && month <= 10 && p.econ.indexOf('A') >= 0) out.push(['flood', month === 9 ? 0.7 : 0.45]);
    if (p.region === 'south' && (month === 11 || month === 12) && p.econ.indexOf('A') >= 0) out.push(['flood', 0.5]);
    if (p.econ.indexOf('T') >= 0) out.push(month >= 11 || month <= 2 ? ['tourism_up', 0.4] : month >= 6 && month <= 9 ? ['tourism_down', 0.5] : null);
    return out.filter(Boolean);
  }
  S77.registerSystem({
    id: 'provinces',
    init(g) {
      g.provState = S77.PROVINCES.map(initProvinceState);

        if (d < bd) { bd = d; best = { type: 'npc', npc: n, label: 'คุยกับ ' + n.name, hl: null }; }
      }
      if (!best) for (const a of this.animals || []) {
        const d = Math.hypot(a.x - p.x, a.y - p.y);
        if (d < 1.2 && a.species === 'dog') { best = { type: 'dog', animal: a, label: 'ลูบหัวน้องหมา 🐶' }; break; }
      }
      // building doors
      if (!best) {
        const px = Math.floor(p.x), py = Math.floor(p.y);
        let bb = null, bdd = 1.45;
        for (let ty = py - 2; ty <= py + 2; ty++) for (let tx = px - 2; tx <= px + 2; tx++) {
          if (!w.inb(tx, ty) || !(w.flag[ty * w.W + tx] & S77.F_DOOR)) continue;
          const d = Math.hypot(tx + 0.5 - p.x, ty + 0.5 - p.y);
          if (d < bdd) {
            // which building owns this door?
            for (const [nx, ny] of [[tx, ty - 1], [tx - 1, ty], [tx, ty + 1], [tx + 1, ty]]) {
              const b = w.buildingAt(nx, ny);
              if (b && b.door && b.door.x === tx && b.door.y === ty && S77.BUILDINGS[b.type].acts.length) { bb = b; bdd = d; }
            }
          }
        }
        if (bb) best = { type: 'building', b: bb, label: (bb.type === 'landmark' ? '📍 ' : '🚪 ') + bb.name, hl: [bb.door.x, bb.door.y] };
      }
      // piers
      if (!best) for (const q of w.pois) if (Math.abs(q.x - p.x) < 3 && Math.abs(q.y - p.y) < 3) {
        const d = Math.hypot(q.x + 0.5 - p.x, q.y + 0.5 - p.y);
        if (d < 1.5) { best = { type: 'pier', poi: q, label: '⛴️ ท่าเรือ', hl: [q.x, q.y] }; break; }
      }
      // objects / terrain activities
      if (!best) {
        const px = Math.floor(p.x), py = Math.floor(p.y);
        const near = [[0, 0], [1, 0], [0, 1], [-1, 0], [0, -1]];
        for (const [ox, oy] of near) {
          const tx = px + ox, ty = py + oy;
          if (!w.inb(tx, ty)) continue;
          const o = w.obj[ty * w.W + tx];
          if (o === O.SPIRIT) { best = { type: 'spirit', label: '🙏 ไหว้ศาลพระภูมิ', hl: [tx, ty] }; break; }
        }
        if (!best) {
          const t = w.terrain(px, py), prov = this.currentProv;
          const seaNear = near.some(([ox, oy]) => { const tt = w.terrain(px + ox, py + oy); return tt === T.SEA || tt === T.DEEP; });
          if (t === T.PADDY) best = { type: 'job', job: 'farm', label: '🌾 ทำนา (' + S77.JOBS.farm.hours + ' ชม.)', hl: [px, py] };
          else if ((t === T.SAND || t === T.MANGROVE) && seaNear) best = { type: 'job', job: 'fishing', label: '🎣 ออกหาปลา (' + S77.JOBS.fishing.hours + ' ชม.)', hl: [px, py] };
          else if (t === T.PLANT && prov && prov.region === 'south') best = { type: 'job', job: 'rubber', label: '🌳 กรีดยาง (' + S77.JOBS.rubber.hours + ' ชม.)', hl: [px, py] };
          else if (t === T.ORCHARD) best = { type: 'job', job: 'orchard', label: '🍈 เก็บผลไม้ (' + S77.JOBS.orchard.hours + ' ชม.)', hl: [px, py] };
        }
      }
      this.target = best;
    }
    interact() {

      if (t.type === 'dog') { if (this.daily('dog' + t.animal.id)) { this.stat('mood', 4); S77.UI.toast('🐶 น้องหมากระดิกหางดีใจ อารมณ์ดีขึ้น', 'good'); } else S77.UI.toast('🐶 น้องหมานอนหลับสบาย'); return; }

      for (const q of this.quests) if (!q.done && q.type === 'deliver' && q.target === pi && b.type === 'market') opts.unshift({ label: '📦 ส่งของฝาก (ภารกิจของ ' + q.giverName + ')', run: () => { this.removeItem('parcel_' + q.id, 1); S77.SYSTEMS.find((s) => s.id === 'quests').complete(this, q); } });

    confirmJob(job, pi) {

      const pay = S77.Econ.wage(this, job, pi);

    doJob(job, pi) {
